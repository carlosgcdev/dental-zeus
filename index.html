<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Agenda tu cita · Consultorio Dental Zeus</title>
<meta name="description" content="Prototipo del sistema de citas en línea del Consultorio Dental Zeus, Pachuca.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0A1B33;--ink-2:#42536B;--ink-3:#5E6E85;--line:#D7E0EC;--line-2:#E8EDF4;--bg:#fff;--tint:#F3F7FC;
  --volt:#0B5FFF;--volt-d:#0847C2;--volt-soft:#E6EFFF;--night:#071A38;
  --urgent:#B42318;--urgent-d:#912018;--urgent-soft:#FDEEEC;
  --ok:#08704C;--ok-soft:#E2F5EC;--amber:#8A5400;--amber-soft:#FFF3D9;--teal:#0A6C7A;--teal-soft:#DFF4F6;--indigo:#4338B8;--indigo-soft:#ECEAFE;--gray-soft:#EDF0F5;
  --heat-0:#EEF2F8;--wa-green:#D9FDD3;--wa-bg:#EFE7DD;--wa-head:#075E54;--wa-text:#008069;
  --r:14px;--r-sm:10px;--bar:52px;
  --font:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:calc(var(--bar) + 12px)}
body{margin:0;font:400 16px/1.5 var(--font);color:var(--ink);background:var(--bg);overflow-x:hidden}
h1,h2,h3,p,ul,ol,dl,dd,figure{margin:0;padding:0}
ul,ol{list-style:none}
h1{font-size:clamp(1.65rem,6vw,2.5rem);line-height:1.12;font-weight:800;letter-spacing:-.022em;text-wrap:balance}
h2{font-size:1.3rem;line-height:1.25;font-weight:700;letter-spacing:-.01em}
img{max-width:100%;display:block}
a{color:var(--volt-d)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--volt);outline-offset:2px;border-radius:6px}
.wrap{width:100%;max-width:1060px;margin:0 auto;padding:0 16px}
.ic{width:20px;height:20px;flex:none}.ic-sm{width:16px;height:16px;flex:none}.ic-xs{width:12px;height:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.muted{color:var(--ink-3)}.mt{margin-top:16px}
.sub{color:var(--ink-2);margin-top:6px}

/* Barra de cambio de vista */
.switch-bar{position:sticky;top:0;z-index:40;height:var(--bar);display:flex;align-items:center;gap:8px;padding:0 10px;background:var(--night);color:#fff}
.demo-tag{font-size:.64rem;font-weight:700;letter-spacing:.1em;color:#B9C8E3;border:1px solid #3A4E73;border-radius:5px;padding:2px 5px}
.switch{flex:1;display:grid;grid-template-columns:1fr 1fr;background:#1A2E52;border-radius:10px;padding:3px;max-width:400px;margin:0 auto;min-width:0}
.switch a{display:flex;align-items:center;justify-content:center;min-height:36px;padding:0 4px;border-radius:8px;color:#CBD7EC;text-decoration:none;font-size:.82rem;font-weight:600;white-space:nowrap;text-align:center}
.switch a.on{background:#fff;color:var(--night)}
.wa-open{position:relative;width:40px;height:40px;flex:none;display:grid;place-items:center;border:0;border-radius:10px;background:#1A2E52;color:#64E08A}
.badge{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:#fff;color:var(--night);font-size:.68rem;font-weight:800;line-height:18px;text-align:center}
.badge[hidden]{display:none}

/* Encabezado paciente */
.top{border-bottom:1px solid var(--line-2);background:#fff}
.top-in{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:60px}
.brand{display:flex;align-items:center;gap:9px;text-decoration:none;color:var(--ink)}
.brand-mark{width:34px;height:34px;color:var(--volt);flex:none}
.brand-text{display:flex;flex-direction:column;line-height:1.1}
.brand-text b{font-size:1.04rem;font-weight:800;letter-spacing:-.01em}
.brand-text small{font-size:.72rem;color:var(--ink-3)}
.top-tel{display:inline-flex;align-items:center;gap:6px;min-height:44px;text-decoration:none;font-weight:600;font-size:.9rem;color:var(--ink)}
.top-tel .ic{width:17px;height:17px;color:var(--volt)}

/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:12px;border:1.5px solid transparent;background:none;font-weight:700;font-size:.98rem;text-decoration:none;transition:background-color .15s,border-color .15s;text-align:center;line-height:1.15}
.btn-lg{min-height:54px;font-size:1.04rem;padding:0 22px}
.btn-sm{min-height:40px;padding:0 13px;font-size:.88rem;border-radius:10px}
.btn-block{width:100%}
.btn-volt,.btn-primary{background:var(--volt);color:#fff}.btn-volt:hover,.btn-primary:hover{background:var(--volt-d)}
.btn-volt:disabled{background:#C5D0E0;color:#fff;cursor:not-allowed}
.btn-urgent{background:var(--urgent);color:#fff}.btn-urgent:hover{background:var(--urgent-d)}
.btn-danger{background:var(--urgent);color:#fff}
.btn-ghost{background:#fff;border-color:var(--line);color:var(--ink)}.btn-ghost:hover{border-color:var(--volt);color:var(--volt-d)}
.btn-ghost-danger{background:#fff;border-color:#EBC3BE;color:var(--urgent)}
.icon-btn{width:44px;height:44px;display:grid;place-items:center;border:1px solid var(--line);border-radius:11px;background:#fff;flex:none}
.icon-btn:disabled{opacity:.3;cursor:not-allowed}
.linklike{display:inline;padding:0;border:0;background:none;color:var(--volt-d);text-decoration:underline;font-weight:600}

/* Hero */
.hero{background:linear-gradient(170deg,#071A38 0%,#0B2B5E 100%);color:#fff}
.hero-in{display:grid;gap:22px;padding-top:26px;padding-bottom:28px}
.rating{display:flex;align-items:center;gap:6px;font-size:.92rem;color:#D7E3F7}
.rating b{color:#fff}.ic-star{width:17px;height:17px;color:#FFC83D}
.hero h1{margin-top:12px}
.lead{margin-top:12px;color:#D7E3F7;font-size:1.04rem;max-width:34em}
.hero-cta{display:grid;gap:10px;margin-top:20px}
.hero-photo{border-radius:var(--r);overflow:hidden;border:1px solid #2A4A7F}
.hero-photo img{width:100%;height:100%;object-fit:cover;aspect-ratio:16/10}

/* Secciones */
.section{padding:34px 0}
.section-tint{background:var(--tint)}
.svc-grid{display:grid;gap:10px;margin-top:18px}
.svc{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px;border:1.5px solid var(--line);border-radius:var(--r);background:#fff;text-decoration:none;color:var(--ink);transition:border-color .15s,background-color .15s}
.svc:hover{border-color:var(--volt)}
.svc-body{display:flex;flex-direction:column;gap:2px;min-width:0}
.svc-body b{font-size:1.04rem;font-weight:700}
.svc-body span{font-size:.88rem;color:var(--ink-2);line-height:1.35}
.svc-dur{display:inline-flex;align-items:center;gap:3px;color:var(--ink-3);font-size:.82rem;white-space:nowrap;font-weight:600}
.svc-urgent{border-color:#EBC3BE;background:var(--urgent-soft)}
.trust{display:grid;gap:16px;margin-top:18px}
.trust li{padding-left:14px;border-left:3px solid var(--volt)}
.trust b{display:block}.trust span{color:var(--ink-2);font-size:.94rem}
.gallery{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.gallery figure{min-width:0}
.gallery img,.g-empty>span{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:var(--r-sm)}
.g-real{grid-column:1/-1}.g-real img{aspect-ratio:16/10}
.g-empty>span{display:grid;place-items:center;background:var(--tint);border:1.5px dashed #B9C7DA;color:var(--ink-3);font-size:.82rem;font-weight:600}
figcaption{font-size:.84rem;color:var(--ink-2);margin-top:5px;line-height:1.3}
.two{display:grid;gap:28px}
.addr{margin:10px 0 3px;font-weight:600}
.two .btn{margin-top:12px}
.hours{width:100%;border-collapse:collapse;margin-top:8px}
.hours th,.hours td{padding:8px 0;border-bottom:1px solid var(--line);text-align:left;font-weight:400;font-size:.95rem}
.hours td{text-align:right}
.hours .is-today th,.hours .is-today td{font-weight:700}
.hours small{color:var(--volt-d);font-weight:700;margin-left:3px}
.foot{padding:26px 0 90px;background:#fff;border-top:1px solid var(--line-2);font-size:.84rem;color:var(--ink-2)}
.foot p{margin-bottom:6px}.foot b{color:var(--ink)}
.urgent-fab{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:30;display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px;border-radius:14px;background:var(--urgent);color:#fff;font-weight:700;text-decoration:none;box-shadow:0 6px 18px rgba(120,20,10,.3)}

/* Flujo */
.flow{padding:14px 0 92px;min-height:70vh}
.flow-in{display:block}.flow-in.narrow{max-width:560px}
.back{display:inline-flex;align-items:center;gap:4px;min-height:40px;text-decoration:none;font-weight:600;font-size:.92rem;color:var(--ink-2)}
.steps{display:flex;gap:4px;margin:6px 0 18px;font-size:.78rem;color:var(--ink-3)}
.steps li{flex:1;display:flex;align-items:center;gap:6px;padding-top:7px;border-top:3px solid var(--line);font-weight:600;min-width:0}
.steps li>span{width:18px;height:18px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--line-2);font-size:.68rem}
.steps .on{border-color:var(--volt);color:var(--ink)}.steps .on>span{background:var(--volt);color:#fff}
.steps .done{border-color:var(--volt)}.steps .done>span{background:var(--volt-soft);color:var(--volt-d)}
.pick{display:grid;gap:22px;margin-top:18px}
.cal{border:1px solid var(--line);border-radius:var(--r);padding:10px}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-dow span{text-align:center;font-size:.72rem;font-weight:700;color:var(--ink-3);padding:3px 0}
.cal-day{aspect-ratio:1;min-height:40px;display:grid;place-items:center;border:0;border-radius:10px;background:var(--volt-soft);color:var(--volt-d);font-weight:700;font-size:.96rem;padding:0}
.cal-day.off{background:none;color:#A3AFBF;font-weight:400}
.cal-day.today{box-shadow:inset 0 0 0 2px var(--volt)}
.cal-day.sel{background:var(--volt);color:#fff}
.slot-date{font-weight:700;font-size:1.04rem}
.slot-title{font-size:.84rem;font-weight:600;color:var(--ink-3);margin:12px 0 7px}
.slot-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.slot{min-height:46px;padding:0 2px;border:1.5px solid var(--line);border-radius:10px;background:#fff;font-weight:600;font-size:.86rem;white-space:nowrap}
.slot:hover{border-color:var(--volt)}
.slot.sel{background:var(--volt);border-color:var(--volt);color:#fff}
.action-bar{position:sticky;bottom:0;z-index:20;display:flex;align-items:center;gap:12px;justify-content:space-between;margin:18px -16px 0;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line)}
.action-summary{font-weight:600;font-size:.86rem;line-height:1.25;min-width:0}
.action-bar .btn{flex:none;min-height:50px}
.wait-cta{margin-top:20px;padding:15px;background:var(--tint);border-radius:var(--r);margin-bottom:60px}
.wait-cta .btn{margin-top:10px;width:100%}
.sum-card{display:flex;flex-direction:column;padding:12px 14px;margin-top:12px;background:var(--volt-soft);border-radius:var(--r-sm)}
.sum-card span{font-size:.94rem;color:var(--ink-2)}
.demo-note{margin-top:12px;font-size:.84rem;color:var(--amber);background:var(--amber-soft);border-radius:9px;padding:8px 11px}
form{margin-top:16px}
.field{display:block;border:0;padding:0;margin:0 0 14px;min-width:0}
.field>span,.field>legend{display:block;font-weight:600;font-size:.92rem;margin-bottom:5px;padding:0}
.field small{font-weight:400;color:var(--ink-3)}
input:not([type=checkbox]):not([type=radio]),select,textarea{width:100%;min-height:48px;padding:10px 12px;border:1.5px solid #B9C6D8;border-radius:11px;background:#fff;font-size:16px}
input:focus,select:focus,textarea:focus{border-color:var(--volt);outline:2px solid var(--volt);outline-offset:0}
[aria-invalid=true]{border-color:var(--urgent)!important}
.err{color:var(--urgent);font-size:.88rem;font-weight:600;margin-top:4px}
.seg{display:flex;flex-wrap:wrap;gap:7px}
.seg label{flex:1 1 auto;position:relative}
.seg input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0}
.seg span{display:flex;align-items:center;justify-content:center;min-height:46px;padding:0 10px;border:1.5px solid var(--line);border-radius:11px;font-weight:600;font-size:.9rem;text-align:center}
.seg input:checked+span{background:var(--volt-soft);border-color:var(--volt);color:var(--volt-d)}
.seg input:focus-visible+span{outline:3px solid var(--volt);outline-offset:2px}
.check{display:flex;gap:10px;align-items:flex-start;margin-bottom:12px;font-size:.88rem;line-height:1.4;color:var(--ink-2)}
.check input{width:22px;height:22px;flex:none;margin:0;accent-color:var(--volt)}
.done-mark{width:52px;height:52px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;margin:8px 0 12px}
.done-mark .ic{width:28px;height:28px}
#doneTitle:focus{outline:0}
.facts{margin-top:16px;border-top:1px solid var(--line)}
.facts>div{display:grid;grid-template-columns:82px 1fr;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.facts dt{color:var(--ink-3);font-size:.88rem}.facts dd{font-weight:600;font-size:.96rem;min-width:0}
.facts a{font-weight:600}
.facts.compact dd{font-weight:400}
.prep{margin-top:20px;padding:14px;background:var(--tint);border-radius:var(--r-sm)}
.prep h2{font-size:1.02rem;margin-bottom:6px}.prep li{font-size:.94rem;margin-top:5px;color:var(--ink-2)}
.stack{display:grid;gap:9px;margin-top:18px}
.note{margin-top:16px;padding:14px;background:var(--amber-soft);border-radius:var(--r-sm)}.note .btn{margin-top:10px}
.legal h1{margin-top:10px}.legal h2{font-size:1.05rem;margin:16px 0 4px}.legal p{font-size:.92rem;color:var(--ink-2);margin-top:6px}.legal .chip{margin-top:0}

/* WhatsApp */
.wa-section{margin-top:26px}
.wa-section h2{font-size:1.14rem}
.wa-section .wa,.wa-section .tabs-mini{margin-top:11px}
.wa{border-radius:18px;overflow:hidden;border:1px solid #CFC8BB;background:var(--wa-bg)}
.wa-head{display:flex;align-items:center;gap:9px;padding:9px 12px;background:var(--wa-head);color:#fff}
.wa-logo{width:34px;height:34px;padding:5px;border-radius:50%;background:#fff;color:var(--volt);flex:none}
.wa-head b{display:block;font-size:.92rem;line-height:1.15}.wa-head small{font-size:.72rem;color:#CFE9E3}
.wa-body{padding:12px 10px;display:flex;flex-direction:column;gap:3px;max-height:62vh;overflow-y:auto}
.wa-empty{font-size:.9rem;color:#5B5346;text-align:center;padding:24px 10px}
.bubble{align-self:flex-start;position:relative;max-width:96%;background:var(--wa-green);border-radius:4px 12px 12px 12px;padding:8px 10px 5px;box-shadow:0 1px 1px rgba(0,0,0,.12);margin-top:8px;color:#111B21}
.bubble-text{font-size:.92rem;line-height:1.38;overflow-wrap:anywhere}
.bubble time{display:block;text-align:right;font-size:.68rem;color:#667781;margin-top:2px}
.bubble-btns{display:flex;flex-direction:column;gap:3px;max-width:96%;align-self:flex-start;width:100%}
.bubble-btns button,.bubble-btns span{display:flex;align-items:center;justify-content:center;min-height:42px;width:100%;border:0;border-radius:9px;background:#fff;color:var(--wa-text);font-weight:600;font-size:.92rem;box-shadow:0 1px 1px rgba(0,0,0,.1)}
.tabs-mini{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-left:-16px;margin-right:-16px;padding:0 16px 2px}
.tabs-mini::-webkit-scrollbar{display:none}
.tabs-mini button{flex:none;min-height:40px;padding:0 12px;border:1.5px solid var(--line);border-radius:20px;background:#fff;font-weight:600;font-size:.84rem;white-space:nowrap}
.tabs-mini [aria-selected=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.phone-sheet{width:min(440px,100vw - 16px);max-height:calc(100dvh - 24px);border:0;border-radius:18px;padding:12px;background:#fff;color:var(--ink)}
.phone-sheet::backdrop,.modal::backdrop{background:rgba(5,16,36,.58)}
.ph-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.ph-sel{display:block;margin-bottom:8px}.ph-sel span{font-size:.82rem;font-weight:600;color:var(--ink-3)}
.phone-sheet .wa-body{max-height:62dvh}

/* Modal */
.modal{width:min(520px,100vw - 16px);max-height:calc(100dvh - 24px);border:0;border-radius:18px;padding:0;background:#fff;color:var(--ink)}
.modal-body{padding:18px}
.modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.modal-sub{color:var(--ink-2);margin:4px 0 10px;font-size:.94rem}
.modal-body>p{margin-top:8px}
.modal .wa{margin-top:12px}
.row-end{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px;margin-top:16px}
.mini-h{font-size:.9rem;font-weight:700;margin:16px 0 7px}
.state-btns{display:flex;flex-wrap:wrap;gap:7px}
.toast{position:fixed;left:12px;right:12px;bottom:calc(72px + env(safe-area-inset-bottom));z-index:70;max-width:440px;margin:0 auto;padding:12px 14px;border-radius:12px;background:var(--ink);color:#fff;font-weight:600;font-size:.92rem;box-shadow:0 8px 24px rgba(5,16,36,.3)}
.toast[hidden]{display:none}
.toast-ok{background:var(--ok)}.toast-err{background:var(--urgent)}

/* Estados */
.chip{display:inline-block;padding:2px 9px;border-radius:20px;font-size:.76rem;font-weight:700;white-space:nowrap}
.chip-pendiente{background:var(--amber-soft);color:var(--amber)}
.chip-confirmada{background:var(--volt-soft);color:var(--volt-d)}
.chip-llego{background:var(--teal-soft);color:var(--teal)}
.chip-en_atencion{background:var(--indigo-soft);color:var(--indigo)}
.chip-terminada{background:var(--gray-soft);color:#4A5870}
.chip-no_asistio{background:var(--urgent-soft);color:var(--urgent)}
.chip-cancelada{background:var(--gray-soft);color:#4A5870}

/* Consultorio */
.adm-top{background:#fff;border-bottom:1px solid var(--line)}
.adm-top-in{display:flex;align-items:center;justify-content:space-between;min-height:60px;gap:10px}
.adm-tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.adm-tabs::-webkit-scrollbar{display:none}
.adm-tabs a{position:relative;display:flex;align-items:center;gap:6px;min-height:44px;padding:0 11px;color:var(--ink-2);text-decoration:none;font-weight:600;font-size:.92rem;white-space:nowrap;border-bottom:3px solid transparent}
.adm-tabs a.on{color:var(--volt-d);border-color:var(--volt)}
.dot-count{min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:var(--urgent);color:#fff;font-size:.68rem;font-weight:800;line-height:18px;text-align:center}
.adm{background:var(--tint);min-height:75vh;padding:16px 0 80px}
.adm-h{font-size:1.5rem}
.adm-h-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.alert{padding:13px;background:#fff;border:1.5px solid #E7C98E;border-left:5px solid #C98A12;border-radius:var(--r-sm);margin-bottom:14px}
.alert h2{font-size:1rem}
.alert-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding-top:10px;margin-top:10px;border-top:1px solid var(--line-2)}
.alert-row b{display:block;font-size:.95rem}.alert-row span{font-size:.86rem;color:var(--ink-2)}
.alert-actions{display:flex;gap:6px}
.ag-bar{display:flex;justify-content:center;margin-bottom:10px}
.seg-sm{display:inline-flex;background:#E2E9F3;border-radius:10px;padding:3px}
.seg-sm button{min-height:38px;padding:0 15px;border:0;border-radius:8px;background:none;font-weight:600;font-size:.88rem;color:var(--ink-2)}
.seg-sm .on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(10,27,51,.15)}
.ag-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;text-align:center}
.ag-nav b{font-size:1rem;line-height:1.2}
.ag-list{display:flex;flex-direction:column;gap:7px}

<script>
/* Motor de la demo: datos de ejemplo, horarios, reglas de agenda, mensajes y métricas.
   Todo vive en memoria: al recargar la página, la demo vuelve a su estado inicial. */
const Zeus = (() => {
  'use strict';
  const HOUR = 3600e3, DAY = 24 * HOUR, MIN = 60e3;
  const TZ = -6 * HOUR; // America/Mexico_City

  const CLINIC = {
    name: 'Consultorio Dental Zeus',
    address: 'Av. Zeus 305, PRI Chacón, 42186 Pachuca de Soto, Hgo.',
    plusCode: '37J7+9C Pachuca de Soto, Hidalgo',
    phone: '771 207 4793', tel: '+527712074793', wa: '527712074793',
    email: 'dental.zeus@gmail.com',
    maps: 'https://www.google.com/maps/search/?api=1&query=Consultorio+Dental+Zeus+Endodoncia+en+Pachuca',
    rating: '4.9', reviews: 61,
    credentials: 'Dr. Érivan López Rivera, Cirujano Dentista Especialista en Endodoncia. Cédula profesional 1166023 (UAEH). Cédula de especialidad 15565355 (ULA).',
    cofepris: 'Av. Pub. COFEPRIS 2613012002A00158 y 2613012002A00159',
  };
  const STATUS = { pendiente: 'Pendiente', confirmada: 'Confirmada', llego: 'Llegó', en_atencion: 'En atención', terminada: 'Terminada', no_asistio: 'No asistió', cancelada: 'Cancelada' };
  const DAYS = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
  const MONTHS = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
  const ACTIVE = ['pendiente', 'confirmada', 'llego', 'en_atencion', 'terminada'];

  const defaultServices = () => [
    { id: 'valoracion', name: 'Consulta de valoración', desc: 'Si no sabes qué necesitas, empieza aquí. Revisamos tu caso y te explicamos las opciones.', dur: 30, active: true, prep: 'Si tienes radiografías o estudios recientes, tráelos.' },
    { id: 'dolor', name: 'Dolor o urgencia', desc: 'Dolor, inflamación, infección o un diente roto.', dur: 30, active: true, prep: 'Si el dolor aumenta o hay inflamación en la cara, escríbenos por WhatsApp de inmediato.' },
    { id: 'endodoncia', name: 'Endodoncia', desc: 'Tratamiento de conductos, nuestra especialidad.', dur: 90, active: true, followLabel: 'revisión de tu endodoncia', prep: 'Come algo ligero antes de venir y trae tu radiografía si ya tienes una. Si tomas medicamentos, avísanos.' },
    { id: 'revision', name: 'Revisión', desc: 'Control de un tratamiento previo o revisión general.', dur: 20, active: true, prep: 'No requiere preparación especial.' },
    { id: 'limpieza', name: 'Limpieza dental', desc: 'Limpieza y revisión de encías.', dur: 45, active: true, followLabel: 'limpieza dental', prep: 'Cepíllate normalmente antes de tu cita.' },
    { id: 'resinas', name: 'Resinas', desc: 'Restauración de caries o piezas dañadas.', dur: 45, active: true, prep: 'Come algo ligero antes de venir.' },
    { id: 'blanqueamiento', name: 'Blanqueamiento dental', desc: 'Primero revisamos que sea adecuado para ti.', dur: 60, active: true, prep: 'Evita café, té y vino tinto el día de tu cita.' },
    { id: 'coronas', name: 'Coronas y prótesis', desc: 'Zirconia, metal-porcelana y metálicas; prótesis fija, removible y total.', dur: 45, active: true, prep: 'Si ya usas prótesis, tráela a tu cita.' },
    { id: 'incrustaciones', name: 'Incrustaciones', desc: 'Metálicas o de disilicato de litio.', dur: 60, active: true, prep: 'Come algo ligero antes de venir.' },
    { id: 'infantil', name: 'Atención infantil', desc: 'Pulpotomía, coronas de acero-cromo y mantenedor de espacio.', dur: 45, active: true, prep: 'La niña o el niño debe venir con su madre, padre o tutor.' },
  ];
  const wk = (close) => ({ open: 660, close, breakFrom: null, breakTo: null });
  const defaultSettings = () => ({
    hours: { 0: null, 1: wk(1200), 2: wk(1200), 3: wk(1200), 4: wk(1200), 5: wk(1200), 6: wk(1080) }, // Google Maps
    bufferMin: 10, minLeadHours: 2, maxDays: 30, unconfirmedHours: 12, slotStep: 30, holdMin: 30, firstVisitEarlyMin: 10,
  });

  let S = null, seq = 1;
  const uid = (p) => p + (seq++).toString(36);
  const now = () => Date.now() + (S ? S.clockOffset : 0);

  const pad = (n) => String(n).padStart(2, '0');
  const local = (ms) => new Date(ms + TZ);
  const dayKey = (ms) => { const d = local(ms); return `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}`; };
  const minutesOf = (ms) => { const d = local(ms); return d.getUTCHours() * 60 + d.getUTCMinutes(); };
  const fromLocal = (key, minutes) => { const [y, m, d] = key.split('-').map(Number); return Date.UTC(y, m - 1, d) + minutes * MIN - TZ; };
  const weekdayOf = (key) => { const [y, m, d] = key.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d)).getUTCDay(); };
  const addDays = (key, n) => dayKey(fromLocal(key, 720) + n * DAY);
  const fmtMinutes = (t) => { const h24 = Math.floor(t / 60), m = t % 60, h = h24 % 12 || 12; return `${h}:${pad(m)} ${h24 < 12 ? 'a. m.' : 'p. m.'}`; };
  const fmtTime = (ms) => fmtMinutes(minutesOf(ms));
  const fmtDate = (ms) => { const d = local(ms); return `${DAYS[d.getUTCDay()].toLowerCase()} ${d.getUTCDate()} de ${MONTHS[d.getUTCMonth()]}`; };
  const fmtKey = (key) => fmtDate(fromLocal(key, 720));
  const toHHMM = (t) => `${pad(Math.floor(t / 60))}:${pad(t % 60)}`;
  const fromHHMM = (v) => { if (!v) return null; const [h, m] = v.split(':').map(Number); return h * 60 + m; };
  const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);

  const service = (id) => S.services.find((x) => x.id === id);
  const normPhone = (v) => { const d = String(v || '').replace(/\D/g, ''); return d.length > 10 ? d.slice(-10) : d; };
  const validPhone = (v) => /^\d{10}$/.test(normPhone(v));
  const prettyPhone = (p) => `${p.slice(0, 3)} ${p.slice(3, 6)} ${p.slice(6)}`;
  const windowOf = (key) => S.settings.hours[weekdayOf(key)] || null;

  /* ---------- Disponibilidad: sin sobrecupo y con margen entre citas ---------- */
  function busyOf(key, opts = {}) {
    const dayStart = fromLocal(key, 0), dayEnd = dayStart + DAY;
    const appts = S.appts.filter((a) => ACTIVE.includes(a.status) && a.id !== opts.ignoreAppt && a.start < dayEnd && a.end > dayStart).map((a) => [a.start, a.end]);
    S.waitlist.filter((w) => w.status === 'avisado' && w.offer && w.id !== opts.ignoreOffer).forEach((w) => { if (w.offer.start < dayEnd && w.offer.end > dayStart) appts.push([w.offer.start, w.offer.end]); });
    const hard = S.blocks.filter((b) => b.from < dayEnd && b.to > dayStart).map((b) => [b.from, b.to]);
    const w = windowOf(key);
    if (w && w.breakFrom != null && w.breakTo != null) hard.push([fromLocal(key, w.breakFrom), fromLocal(key, w.breakTo)]);
    return { appts, hard, buffer: S.settings.bufferMin * MIN };
  }
  function isFree(key, startMs, durMin, opts = {}) {
    const w = windowOf(key);
    if (!w) return false;
    const end = startMs + durMin * MIN;
    if (startMs < fromLocal(key, w.open) || end > fromLocal(key, w.close)) return false;
    const { appts, hard, buffer } = busyOf(key, opts);
    if (hard.some(([a, b]) => startMs < b && end > a)) return false;
    return !appts.some(([a, b]) => startMs < b + buffer && end + buffer > a);
  }
  function slots(serviceId, key, opts = {}) {
    const svc = service(serviceId), w = windowOf(key), t = now();
    if (!svc || !w) return [];
    const { minLeadHours, maxDays, slotStep } = S.settings;
    const earliest = opts.staff ? t : t + minLeadHours * HOUR;
    if (!opts.staff && key > addDays(dayKey(t), maxDays)) return [];
    const candidates = new Set();
    for (let m = w.open; m + svc.dur <= w.close; m += slotStep) candidates.add(fromLocal(key, m));
    const { appts, hard, buffer } = busyOf(key, opts);
    appts.forEach(([, b]) => candidates.add(fromLocal(key, Math.ceil(minutesOf(b + buffer) / 5) * 5)));
    hard.forEach(([, b]) => { if (dayKey(b) === key) candidates.add(fromLocal(key, Math.ceil(minutesOf(b) / 5) * 5)); });
    const free = [...candidates].filter((s) => s >= earliest && isFree(key, s, svc.dur, opts)).sort((a, b) => a - b);
    return free.filter((s, i) => i === 0 || s - free[i - 1] >= 15 * MIN);
  }
  function firstAvailableDay(serviceId, opts) {
    let key = dayKey(now());
    for (let i = 0; i <= S.settings.maxDays; i++) { if (slots(serviceId, key, opts).length) return key; key = addDays(key, 1); }
    return null;
  }

  /* ---------- Textos de los mensajes ---------- */
  const firstName = (name) => (name || '').trim().split(/\s+/)[0] || '';
  const dateLine = (a) => `${fmtDate(a.start)} a las ${fmtTime(a.start)}`;
  const manageBtns = (a) => [{ label: 'Confirmar', action: 'confirm', ref: a.id }, { label: 'Reagendar', action: 'reschedule', ref: a.id }, { label: 'Cancelar', action: 'cancel', ref: a.id }];
  const mapsBtn = { label: 'Cómo llegar', action: 'maps' };
  const T = {
    confirmacion: (a, p, s) => `Hola, ${firstName(p.name)}. Tu cita en ${CLINIC.name} quedó apartada.\n\n${cap(fmtDate(a.start))}, ${fmtTime(a.start)}\n${s.name}\n${CLINIC.address}\n\n${a.firstVisit ? `Como es tu primera visita, llega ${S.settings.firstVisitEarlyMin} minutos antes para llenar tu historia clínica.\n` : ''}${s.prep}`,
    r24: (a, p, s) => `Hola, ${firstName(p.name)}. Te recordamos tu cita de ${s.name.toLowerCase()} mañana a las ${fmtTime(a.start)}.\n\n${s.prep}\n\n¿Nos confirmas tu asistencia? Si no puedes venir, cambiarla ayuda a que otro paciente use ese horario.`,
    r2: (a, p) => `${firstName(p.name)}, te esperamos hoy a las ${fmtTime(a.start)} en ${CLINIC.address}${a.firstVisit ? ` Recuerda llegar ${S.settings.firstVisitEarlyMin} minutos antes.` : ''}`,
    gracias: (a, p) => `Gracias por tu visita, ${firstName(p.name)}. Si tienes alguna molestia o duda después del tratamiento, escríbenos por aquí.\n\nSi te atendimos bien, tu opinión en Google nos ayuda mucho y le sirve a otros pacientes.`,
    seguimiento: (a, p, s) => `Hola, ${firstName(p.name)}. Ya es momento de tu ${s.followLabel || 'revisión'}. Revisarlo a tiempo ayuda a detectar cualquier problema antes de que duela. ¿Te apartamos un horario?`,
    cancelada: (a, p) => `${firstName(p.name)}, tu cita del ${dateLine(a)} quedó cancelada. Cuando quieras volver a agendar, aquí estamos.`,
    reagendada: (a, p) => `Listo, ${firstName(p.name)}. Tu cita cambió al ${dateLine(a)}. Te enviaremos un recordatorio antes.`,
    confirmada: (a, p) => `Gracias, ${firstName(p.name)}. Tu cita del ${dateLine(a)} está confirmada.`,
    oferta: (w, s) => `Hola, ${firstName(w.name)}. Se liberó un horario para ${s.name.toLowerCase()}: ${fmtDate(w.offer.start)} a las ${fmtTime(w.offer.start)}.\n\nLo guardamos para ti ${S.settings.holdMin} minutos. ¿Lo quieres?`,
  };
  // Las horas ya terminan en "p. m."; evita el doble punto al cerrar la frase.
  Object.keys(T).forEach((k) => { const f = T[k]; T[k] = (...x) => f(...x).split("m..").join("m."); });
  const PREVIEWS = [
    { id: 'r24', when: '24 horas antes', text: (a, p, s) => T.r24(a, p, s), buttons: ['Confirmar', 'Reagendar', 'Cancelar'] },
    { id: 'r2', when: '2 horas antes', text: (a, p, s) => T.r2(a, p, s), buttons: ['Cómo llegar'] },
    { id: 'gracias', when: 'Después de la cita', text: (a, p, s) => T.gracias(a, p, s), buttons: ['Dejar mi opinión en Google'] },
    { id: 'seguimiento', when: 'A los 6 meses', text: (a, p, s) => T.seguimiento(a, p, s.followLabel ? s : service('limpieza')), buttons: ['Agendar'] },
  ];
  function send(phone, kind, text, buttons, apptId) {
    S.messages.push({ id: uid('m'), at: now(), phone, kind, text, buttons: buttons || [], apptId: apptId || null });
  }

  /* ---------- Citas ---------- */
  class BookingError extends Error { constructor(code, msg) { super(msg); this.code = code; } }
  function upsertPatient(d) {
    const phone = normPhone(d.phone);
    const p = S.patients[phone] || { phone, name: d.name, email: '', notes: '', optIn: false };
    p.name = d.name || p.name;
    if (d.email) p.email = d.email;
    if (d.optIn !== undefined) p.optIn = !!d.optIn;
    S.patients[phone] = p;
    return p;
  }
  function book(d) {
    const svc = service(d.serviceId), key = dayKey(d.start);
    if (!svc) throw new BookingError('service', 'Servicio no disponible.');
    if (!validPhone(d.phone)) throw new BookingError('phone', 'Escribe un WhatsApp de 10 dígitos.');
    const allowed = slots(d.serviceId, key, { staff: d.source !== 'web', ignoreOffer: d.ignoreOffer });
    const fits = allowed.includes(d.start) || (d.ignoreOffer && isFree(key, d.start, svc.dur, { ignoreOffer: d.ignoreOffer }));
    if (!fits) throw new BookingError('taken', 'Ese horario acaba de ocuparse. Elige otro, por favor.');
    const p = upsertPatient(d);
    const a = { id: uid('c'), token: uid('t'), phone: p.phone, serviceId: svc.id, start: d.start, end: d.start + svc.dur * MIN, status: 'pendiente', firstVisit: !!d.firstVisit, reason: d.reason || '', source: d.source || 'web', confirmedAt: null, flag: false, notes: '', isNew: true };
    S.appts.push(a);
    send(p.phone, 'confirmacion', T.confirmacion(a, p, svc), manageBtns(a).concat(mapsBtn), a.id);
    flagUnconfirmed();
    return a;
  }
  const appt = (id) => S.appts.find((a) => a.id === id || a.token === id);
  function confirm(id) {
    const a = appt(id);
    if (!a || a.status !== 'pendiente') return a;
    a.status = 'confirmada'; a.confirmedAt = now(); a.flag = false;
    send(a.phone, 'confirmada', T.confirmada(a, S.patients[a.phone]), [mapsBtn], a.id);
    return a;
  }
  function cancel(id, by) {
    const a = appt(id);
    if (!a || !['pendiente', 'confirmada'].includes(a.status)) return null;
    a.status = 'cancelada'; a.cancelledBy = by || 'paciente'; a.flag = false;
    send(a.phone, 'cancelada', T.cancelada(a, S.patients[a.phone]), [{ label: 'Agendar de nuevo', action: 'book' }], a.id);
    return offerFreed(a.start, []);
  }
  function reschedule(id, newStart, staff) {
    const a = appt(id), key = dayKey(newStart);
    if (!a) throw new BookingError('missing', 'No encontramos la cita.');
    if (!slots(a.serviceId, key, { staff, ignoreAppt: a.id }).includes(newStart)) throw new BookingError('taken', 'Ese horario acaba de ocuparse. Elige otro, por favor.');
    const oldStart = a.start, dur = a.end - a.start;
    a.start = newStart; a.end = newStart + dur; a.status = 'pendiente'; a.confirmedAt = null; a.flag = false; a.isNew = true;
    send(a.phone, 'reagendada', T.reagendada(a, S.patients[a.phone]), manageBtns(a).concat(mapsBtn), a.id);
    flagUnconfirmed();
    return { appt: a, offered: offerFreed(oldStart, []) };
  }
  function setStatus(id, status) {
    const a = appt(id);
    if (!a) return null;
    a.status = status; a.flag = false;
    if (status === 'confirmada' && !a.confirmedAt) a.confirmedAt = now();
    return a;
  }
  function flagUnconfirmed() {
    const t = now(), u = S.settings.unconfirmedHours * HOUR;
    S.appts.forEach((a) => { a.flag = a.status === 'pendiente' && a.start > t && a.start - t <= u; });
  }

  /* ---------- Lista de espera ---------- */
  function joinWaitlist(d) {
    if (!validPhone(d.phone)) throw new BookingError('phone', 'Escribe un WhatsApp de 10 dígitos.');
    const p = upsertPatient(d);
    const w = { id: uid('w'), name: d.name, phone: p.phone, serviceId: d.serviceId, pref: d.pref || 'cualquiera', until: d.until, status: 'esperando', order: seq, offer: null };
    S.waitlist.push(w);
    return w;
  }
  const matchesPref = (w, start) => { const m = minutesOf(start); return w.pref === 'cualquiera' || (w.pref === 'temprano' && m < 840) || (w.pref === 'tarde' && m >= 840); };
  function offerFreed(start, skip) {
    const t = now();
    if (start - t < HOUR) return null;
    const key = dayKey(start);
    const next = S.waitlist.filter((w) => w.status === 'esperando' && !skip.includes(w.id) && key <= w.until && matchesPref(w, start) && isFree(key, start, service(w.serviceId).dur)).sort((a, b) => a.order - b.order)[0];
    if (!next) return null;
    next.status = 'avisado';
    next.offer = { start, end: start + service(next.serviceId).dur * MIN, skip };
    send(next.phone, 'oferta', T.oferta(next, service(next.serviceId)), [{ label: 'Sí, lo quiero', action: 'offer-accept', ref: next.id }, { label: 'No puedo', action: 'offer-decline', ref: next.id }]);
    return next;
  }
  function acceptOffer(id) {
    const w = S.waitlist.find((x) => x.id === id);
    if (!w || w.status !== 'avisado') throw new BookingError('offer', 'Este horario ya no está disponible.');
    const a = book({ serviceId: w.serviceId, start: w.offer.start, name: w.name, phone: w.phone, source: 'lista de espera', ignoreOffer: w.id });
    w.status = 'agendado'; w.apptId = a.id; w.offer = null;
    a.status = 'confirmada'; a.confirmedAt = now(); a.flag = false; // ya dijo que sí
    return a;
  }
  function declineOffer(id) {
    const w = S.waitlist.find((x) => x.id === id);
    if (!w || w.status !== 'avisado') return null;
    const { start, skip } = w.offer;
    w.status = 'esperando'; w.offer = null;
    return offerFreed(start, skip.concat(w.id));
  }
  const removeWait = (id) => { S.waitlist = S.waitlist.filter((w) => w.id !== id); };

  /* ---------- Bloqueos ---------- */
  const conflictsIn = (from, to) => S.appts.filter((a) => ['pendiente', 'confirmada'].includes(a.status) && a.start < to && a.end > from);
  function addBlock(b) {
    S.blocks.push({ id: uid('b'), type: b.type, label: b.label || '', from: b.from, to: b.to });
    return conflictsIn(b.from, b.to);
  }
  const removeBlock = (id) => { S.blocks = S.blocks.filter((b) => b.id !== id); };

  /* ---------- Métricas: semanas móviles que terminan en la semana actual de la demo ---------- */
  function metrics(weeks) {
    const t = now(), base = S.anchor, from = fromLocal(addDays(base, -7 * (weeks - 1)), 0), to = fromLocal(addDays(base, 7), 0);
    const inRange = S.appts.filter((a) => a.start >= from && a.start < to);
    const notCancelled = inRange.filter((a) => a.status !== 'cancelada');
    const closed = inRange.filter((a) => a.start < t);
    const finished = closed.filter((a) => a.status === 'terminada').length, noShow = closed.filter((a) => a.status === 'no_asistio').length;
    const confirmed = notCancelled.filter((a) => a.confirmedAt).length;
    const perWeek = [];
    for (let i = weeks - 1; i >= 0; i--) {
      const start = addDays(base, -7 * i), a = fromLocal(start, 0), b = a + 7 * DAY;
      perWeek.push({ start, count: notCancelled.filter((x) => x.start >= a && x.start < b).length, current: i === 0 });
    }
    const svcCount = {};
    notCancelled.forEach((a) => { svcCount[a.serviceId] = (svcCount[a.serviceId] || 0) + 1; });
    const top = Object.entries(svcCount).map(([id, count]) => ({ id, name: service(id).name, count })).sort((a, b) => b.count - a.count);
    const heat = {};
    notCancelled.forEach((a) => { const k = `${weekdayOf(dayKey(a.start))}-${Math.floor(minutesOf(a.start) / 60)}`; heat[k] = (heat[k] || 0) + 1; });
    return { total: notCancelled.length, finished, noShow, confirmRate: notCancelled.length ? confirmed / notCancelled.length : 0, noShowRate: finished + noShow ? noShow / (finished + noShow) : 0, perWeek, top, heat };
  }

  /* ---------- Datos de ejemplo (nombres inventados) ---------- */
  function seed() {
    seq = 1;
    S = { clockOffset: 0, settings: defaultSettings(), services: defaultServices(), blocks: [], patients: {}, appts: [], waitlist: [], messages: [], anchor: null };
    // La demo siempre se presenta a media jornada de un día laboral, a cualquier hora que se abra.
    let anchor = dayKey(Date.now());
    while (!windowOf(anchor)) anchor = addDays(anchor, 1);
    S.anchor = anchor;
    S.clockOffset = fromLocal(anchor, 12 * 60 + 30) - Date.now();
    const names = ['Lucía Hernández Ortiz', 'Mateo Vargas Luna', 'Fernanda Rojas Ávila', 'Andrés Cano Meza', 'Regina Salas Duarte', 'Emiliano Paredes Gil', 'Valeria Núñez Soto', 'Rodrigo Ibarra León', 'Ximena Tapia Mora', 'Gael Fuentes Rey', 'Renata Campos Vera', 'Santiago Olvera Paz', 'Camila Bravo Ríos', 'Diego Montes Lara'];
    names.forEach((name, i) => { const phone = '77100000' + pad(i + 1); S.patients[phone] = { phone, name, email: '', notes: '', optIn: i % 4 !== 3 }; });
    S.patients['7710000001'].notes = 'Prefiere citas después de las 4 p. m.';
    S.patients['7710000004'].notes = 'Alergia a la penicilina (ejemplo).';
    const phones = Object.keys(S.patients);
    const add = (key, min, svc, status, phone, extra = {}) => {
      const start = fromLocal(key, min), dur = service(svc).dur;
      const a = { id: uid('c'), token: uid('t'), phone, serviceId: svc, start, end: start + dur * MIN, status, firstVisit: false, reason: '', source: 'web', confirmedAt: ['confirmada', 'llego', 'en_atencion', 'terminada'].includes(status) ? start - DAY : null, flag: false, notes: '', ...extra };
      S.appts.push(a);
      return a;
    };
    // Semana actual: 12 citas con todos los estados.
    let d = anchor; const nextOpen = (k) => { let x = addDays(k, 1); while (!windowOf(x)) x = addDays(x, 1); return x; };
    add(d, 660, 'revision', 'no_asistio', phones[9], { confirmedAt: null });
    add(d, 690, 'valoracion', 'terminada', phones[1], { source: 'teléfono' });
    add(d, 730, 'dolor', 'en_atencion', phones[2], { reason: 'Dolor en muela inferior derecha', firstVisit: true });
    add(d, 780, 'revision', 'llego', phones[3]);
    add(d, 840, 'resinas', 'confirmada', phones[4]);
    add(d, 960, 'limpieza', 'pendiente', phones[0], { reason: 'Limpieza de rutina' });
    d = nextOpen(d);
    add(d, 660, 'endodoncia', 'confirmada', phones[5], { reason: 'Referido por su dentista' });
    add(d, 780, 'valoracion', 'pendiente', phones[6], { firstVisit: true });
    add(d, 990, 'coronas', 'confirmada', phones[7], { source: 'en persona' });
    d = nextOpen(d);
    add(d, 720, 'infantil', 'pendiente', phones[8], { reason: 'Mi hija tiene una muela picada' });
    add(d, 1020, 'blanqueamiento', 'confirmada', phones[10]);
    d = nextOpen(d);
    add(d, 690, 'endodoncia', 'pendiente', phones[11], { firstVisit: true });

    // Historial de las 7 semanas anteriores, para que paciente y métricas tengan contexto.
    let r = 20261106; const rnd = () => { r = (r * 1664525 + 1013904223) >>> 0; return r / 4294967296; };
    const pickSvc = () => { const v = rnd(); return v < .26 ? 'valoracion' : v < .46 ? 'endodoncia' : v < .6 ? 'dolor' : v < .72 ? 'resinas' : v < .82 ? 'limpieza' : v < .9 ? 'revision' : v < .95 ? 'coronas' : 'infantil'; };
    const peaks = [660, 690, 720, 960, 990, 1020, 1050, 1080];
    [14, 12, 11, 13, 9, 12, 10].forEach((count, wi) => {
      const base = addDays(anchor, -7 * (wi + 1));
      let placed = 0, guard = 0;
      while (placed < count && guard++ < 200) {
        const key = addDays(base, Math.floor(rnd() * 7));
        if (!windowOf(key)) continue;
        const svc = pickSvc(), dur = service(svc).dur;
        const m = rnd() < .6 ? peaks[Math.floor(rnd() * peaks.length)] : windowOf(key).open + Math.floor(rnd() * 16) * 30;
        const start = fromLocal(key, m);
        if (!isFree(key, start, dur)) continue;
        const v = rnd(), status = v < .88 ? 'terminada' : v < .96 ? 'no_asistio' : 'cancelada';
        const a = add(key, m, svc, status, phones[Math.floor(rnd() * phones.length)]);
        a.confirmedAt = status === 'terminada' ? (rnd() < .86 ? a.start - DAY : null) : (rnd() < .2 ? a.start - DAY : null);
        placed++;
      }
    });
    const until = addDays(anchor, 14);
    S.waitlist.push({ id: uid('w'), name: 'Camila Bravo Ríos', phone: phones[12], serviceId: 'endodoncia', pref: 'cualquiera', until, status: 'esperando', order: 1, offer: null });
    S.waitlist.push({ id: uid('w'), name: 'Diego Montes Lara', phone: phones[13], serviceId: 'limpieza', pref: 'tarde', until, status: 'esperando', order: 2, offer: null });
    flagUnconfirmed();
  }

  const icsDate = (ms) => new Date(ms).toISOString().replace(/[-:]/g, '').replace(/\.\d+Z/, 'Z');
  const gcalLink = (a) => `https://calendar.google.com/calendar/render?${new URLSearchParams({ action: 'TEMPLATE', text: `Cita en ${CLINIC.name}`, dates: `${icsDate(a.start)}/${icsDate(a.end)}`, location: CLINIC.address })}`;

  return {
    CLINIC, STATUS, DAYS, MONTHS, ACTIVE, PREVIEWS, HOUR, DAY, MIN, BookingError,
    get S() { return S; }, seed, now, flagUnconfirmed,
    dayKey, minutesOf, fromLocal, weekdayOf, addDays, fmtMinutes, fmtTime, fmtDate, fmtKey, toHHMM, fromHHMM, cap, pad,
    service, normPhone, validPhone, prettyPhone, windowOf, slots, firstAvailableDay, isFree,
    book, appt, confirm, cancel, reschedule, setStatus, joinWaitlist, acceptOffer, declineOffer, removeWait,
    addBlock, removeBlock, conflictsIn, metrics, gcalLink, firstName,
  };
})();

/* Utilidades compartidas de interfaz. */
const UI = (() => {
  'use strict';
  const esc = (v) => String(v == null ? '' : v).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const icon = (id, cls = 'ic') => `<svg class="${cls}" aria-hidden="true"><use href="#${id}"/></svg>`;
  const $ = (sel, root = document) => root.querySelector(sel);
  const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];

  let toastTimer;
  function toast(msg, kind) {
    const el = $('#toast');
    el.textContent = msg;
    el.className = 'toast' + (kind ? ' toast-' + kind : '');
    el.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.hidden = true; }, 4200);
  }

  function modal(html, onReady) {
    const m = $('#modal');
    m.innerHTML = html;
    if (!m.open) m.showModal();
    $$('[data-close]', m).forEach((b) => b.addEventListener('click', () => m.close()));
    if (onReady) onReady(m);
    return m;
  }
  const closeModal = () => { const m = $('#modal'); if (m.open) m.close(); };

  function confirmDialog({ title, body, yes, no = 'Volver', danger }) {
    return new Promise((resolve) => {
      let answered = false;
      const m = modal(`<div class="modal-body"><h2>${esc(title)}</h2><p>${esc(body)}</p>
        <div class="row-end"><button class="btn btn-ghost" data-no>${esc(no)}</button>
        <button class="btn ${danger ? 'btn-danger' : 'btn-primary'}" data-yes>${esc(yes)}</button></div></div>`);
      const done = (v) => { answered = true; m.close(); resolve(v); };
      $('[data-yes]', m).onclick = () => done(true);
      $('[data-no]', m).onclick = () => done(false);
      // Un cierre anterior puede llegar tarde: solo cuenta si este diálogo ya no está abierto.
      const onClose = () => { if (m.open) return; m.removeEventListener('close', onClose); if (!answered) resolve(false); };
      m.addEventListener('close', onClose);
    });
  }

  function download(name, content, type) {
    const url = URL.createObjectURL(new Blob([content], { type }));
    const a = document.createElement('a');
    a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  const urgentHref = () => `https://wa.me/${Zeus.CLINIC.wa}?text=${encodeURIComponent('Hola, tengo dolor y necesito atención lo antes posible.')}`;
  const logoLockup = (href = '#/') => `<a class="brand" href="${href}" aria-label="${esc(Zeus.CLINIC.name)}, inicio">
      ${icon('logo', 'brand-mark')}<span class="brand-text"><b>Dental Zeus</b><small>Endodoncia en Pachuca</small></span></a>`;

  return { esc, icon, $, $$, toast, modal, closeModal, confirmDialog, download, urgentHref, logoLockup };
})();

/* Sitio público: selección de servicio, calendario, datos, confirmación y gestión de la cita. */
const Paciente = (() => {
  'use strict';
  const { esc, icon, $, $$, toast, confirmDialog, urgentHref, logoLockup } = UI;
  const Z = Zeus, C = Z.CLINIC;
  const app = () => $('#app');
  const draft = { serviceId: null, key: null, start: null, month: null, rescheduleId: null, mode: 'book' };

  const header = () => `<header class="top"><div class="wrap top-in">${logoLockup()}
    <a class="top-tel" href="tel:${C.tel}">${icon('i-phone')}<span>${C.phone}</span></a></div></header>`;

  const urgentBar = () => `<a class="urgent-fab" href="${urgentHref()}" target="_blank" rel="noopener">${icon('i-wa')}Tengo dolor: escribir ahora</a>`;

  const footer = () => `<footer class="foot"><div class="wrap">
      <p><b>${esc(C.name)}</b> · ${esc(C.address)}</p>

  function hoursTable() {
    const today = Z.weekdayOf(Z.dayKey(Z.now()));
    return [1, 2, 3, 4, 5, 6, 0].map((d) => {
      const h = Z.S.settings.hours[d];
      return `<tr class="${d === today ? 'is-today' : ''}"><th scope="row">${Z.DAYS[d]}${d === today ? ' <small>hoy</small>' : ''}</th>
        <td>${h ? `${Z.fmtMinutes(h.open)} a ${Z.fmtMinutes(h.close)}` : 'Cerrado'}</td></tr>`;
    }).join('');
  }

  const serviceCards = () => Z.S.services.filter((s) => s.active).map((s) => `
    <a class="svc ${s.id === 'dolor' ? 'svc-urgent' : ''}" href="#/horario/${s.id}">
      <span class="svc-body"><b>${esc(s.name)}</b><span>${esc(s.desc)}</span></span>
      <span class="svc-dur">${s.dur} min ${icon('i-next', 'ic-sm')}</span>
    </a>`).join('');

      <section class="section section-tint" id="ubicacion"><div class="wrap two">
        <div>
          <h2>Dónde estamos</h2>
          <p class="addr">${esc(C.address)}</p>
          <p class="muted">Plus Code: ${esc(C.plusCode)}</p>
          <a class="btn btn-ghost" href="${C.maps}" target="_blank" rel="noopener">${icon('i-pin')}Abrir en Google Maps</a>

          <h2>Horario</h2>
          <table class="hours"><tbody>${hoursTable()}</tbody></table>
        </div>
      </div></section>
    </main>` + footer() + urgentBar();
    // En el inicio ya está el botón grande del hero: el flotante aparece al bajar.
    const fab = $(".urgent-fab"), cta = $(".hero-cta");
    fab.classList.add("is-hidden");
    if ("IntersectionObserver" in window) new IntersectionObserver(([e]) => fab.classList.toggle("is-hidden", e.isIntersecting)).observe(cta);
    else fab.classList.remove("is-hidden");
  }

  /* ---------- Paso 2: fecha y hora ---------- */
  const stepper = (n) => {
    const labels = ['Servicio', 'Fecha y hora', 'Tus datos'];
    return `<ol class="steps" aria-label="Pasos">${labels.map((l, i) => `<li class="${i + 1 === n ? 'on' : i + 1 < n ? 'done' : ''}" ${i + 1 === n ? 'aria-current="step"' : ''}><span>${i + 1 < n ? icon('i-check', 'ic-xs') : i + 1}</span>${l}</li>`).join('')}</ol>`;
  };

  function calendarHTML() {
    const today = Z.dayKey(Z.now()), [y, m] = draft.month.split('-').map(Number);
    const first = `${y}-${Z.pad(m)}-01`, offset = (Z.weekdayOf(first) + 6) % 7;
    const daysIn = new Date(Date.UTC(y, m, 0)).getUTCDate();
    const last = Z.addDays(today, Z.S.settings.maxDays);
    let cells = '<span class="cal-blank"></span>'.repeat(offset);
    const ignoreAppt = draft.rescheduleId || undefined;
    for (let d = 1; d <= daysIn; d++) {
      const key = `${y}-${Z.pad(m)}-${Z.pad(d)}`;
      const open = key >= today && key <= last && Z.slots(draft.serviceId, key, { ignoreAppt }).length > 0;
      const sel = key === draft.key;
      cells += open
        ? `<button type="button" class="cal-day ${sel ? 'sel' : ''} ${key === today ? 'today' : ''}" data-day="${key}" aria-pressed="${sel}" aria-label="${Z.cap(Z.fmtKey(key))}">${d}</button>`
        : `<span class="cal-day off" aria-hidden="true">${d}</span>`;
    }
    const prevDisabled = first <= `${today.slice(0, 7)}-01`;
    const nextDisabled = Z.addDays(first, daysIn) > last;
    return `<div class="cal">
      <div class="cal-head">
        <button type="button" class="icon-btn" data-month="-1" ${prevDisabled ? 'disabled' : ''} aria-label="Mes anterior">${icon('i-back')}</button>
        <b aria-live="polite">${Z.cap(Z.MONTHS[m - 1])} ${y}</b>
        <button type="button" class="icon-btn" data-month="1" ${nextDisabled ? 'disabled' : ''} aria-label="Mes siguiente">${icon('i-next')}</button>
      </div>
      <div class="cal-grid cal-dow" aria-hidden="true">${['L', 'M', 'M', 'J', 'V', 'S', 'D'].map((x) => `<span>${x}</span>`).join('')}</div>
      <div class="cal-grid">${cells}</div>
    </div>`;
  }

  function slotsHTML() {
    if (!draft.key) return '<p class="muted">Elige un día para ver los horarios.</p>';
    const list = Z.slots(draft.serviceId, draft.key, { ignoreAppt: draft.rescheduleId || undefined });
    if (!list.length) return '<p class="muted">Ya no quedan horarios este día. Elige otro.</p>';
    const early = list.filter((s) => Z.minutesOf(s) < 840), late = list.filter((s) => Z.minutesOf(s) >= 840);
    const group = (title, arr) => arr.length ? `<h3 class="slot-title">${title}</h3><div class="slot-grid">${arr.map((s) => `<button type="button" class="slot ${s === draft.start ? 'sel' : ''}" data-slot="${s}" aria-pressed="${s === draft.start}">${Z.fmtTime(s)}</button>`).join('')}</div>` : '';
    return `<p class="slot-date">${Z.cap(Z.fmtKey(draft.key))}</p>${group('Antes de las 2:00 p. m.', early)}${group('Por la tarde', late)}`;
  }

  function horario(serviceId, rescheduleId) {
    const svc = Z.service(serviceId);
    if (!svc) { Main.go('#/'); return; }
    if (draft.serviceId !== serviceId || draft.rescheduleId !== (rescheduleId || null)) {
      draft.serviceId = serviceId; draft.key = null; draft.start = null; draft.rescheduleId = rescheduleId || null;
    }
    const first = draft.key || Z.firstAvailableDay(serviceId);
    if (!draft.key && first) draft.key = first;
    if (!draft.month) draft.month = (first || Z.dayKey(Z.now())).slice(0, 7);
    if (first) draft.month = (draft.key || first).slice(0, 7);
    const a = rescheduleId ? Z.appt(rescheduleId) : null;
    app().innerHTML = header() + `<main class="flow"><div class="wrap flow-in">
      <a class="back" href="${a ? `#/cita/${a.token}` : '#servicios'}">${icon('i-back', 'ic-sm')}${a ? 'Volver a mi cita' : 'Cambiar servicio'}</a>
      ${a ? '' : stepper(2)}
      <h1>${a ? 'Elige tu nuevo horario' : 'Elige fecha y hora'}</h1>
      <p class="sub"><b>${esc(svc.name)}</b> · ${svc.dur} minutos${a ? ` · Cita actual: ${esc(Z.fmtDate(a.start))}, ${Z.fmtTime(a.start)}` : ''}</p>
      <div class="pick">
        <div id="calBox">${calendarHTML()}</div>
        <div id="slotBox" aria-live="polite">${slotsHTML()}</div>
      </div>
      <div class="action-bar"><div class="action-summary" id="pickSummary"></div>
        <button class="btn btn-volt btn-lg" id="goNext" disabled>${a ? 'Cambiar mi cita' : 'Continuar'}</button></div>
      ${a ? '' : `<div class="wait-cta"><p><b>¿No hay un horario que te funcione?</b> Únete a la lista de espera y te avisamos por WhatsApp si se libera uno.</p><a class="btn btn-ghost" href="#/espera/${serviceId}">Avisarme si se libera</a></div>`}
      <a class="urgent-link" href="${urgentHref()}" target="_blank" rel="noopener">${icon("i-wa","ic-sm")}¿Tienes dolor? Escríbenos ahora por WhatsApp</a>
    </div></main>`;
    bindPick(a);
  }

  function refreshPick() {
    $('#calBox').innerHTML = calendarHTML();
    $('#slotBox').innerHTML = slotsHTML();
    $('#pickSummary').textContent = draft.start ? `${Z.cap(Z.fmtDate(draft.start))}, ${Z.fmtTime(draft.start)}` : '';
    $('#goNext').disabled = !draft.start;
  }

  function bindPick(a) {
    const root = $('.pick');
    root.addEventListener('click', (e) => {
      const day = e.target.closest('[data-day]'), slot = e.target.closest('[data-slot]'), month = e.target.closest('[data-month]');
      if (day) { draft.key = day.dataset.day; draft.start = null; refreshPick(); }
      if (slot) { draft.start = Number(slot.dataset.slot); refreshPick(); $(`[data-slot="${draft.start}"]`)?.focus(); }
      if (month) {
        const [y, m] = draft.month.split('-').map(Number), d = new Date(Date.UTC(y, m - 1 + Number(month.dataset.month), 1));
        draft.month = `${d.getUTCFullYear()}-${Z.pad(d.getUTCMonth() + 1)}`;
        $('#calBox').innerHTML = calendarHTML();
      }
    });
    refreshPick();
    $('#goNext').onclick = () => {
      if (a) {
        try {
          const { appt: updated, offered } = Z.reschedule(a.id, draft.start);
          draft.rescheduleId = null; draft.serviceId = null; draft.key = null; draft.start = null;
          toast('Tu cita cambió de horario.', 'ok');
          Main.go(`#/cita/${updated.token}`);
          Main.showOffer(offered);
        } catch (err) { toast(err.message, 'err'); draft.start = null; refreshPick(); }
      } else Main.go('#/datos');
    };
  }

  /* ---------- Paso 3: datos ---------- */
  const consentFields = () => `
    <label class="check"><input type="checkbox" name="privacy" required>
      <span>He leído el <button type="button" class="linklike" data-aviso>aviso de privacidad</button> y autorizo expresamente el uso de mis datos, incluidos los de salud que comparta, para gestionar mi atención dental.</span></label>
    <label class="check"><input type="checkbox" name="optIn">
      <span>Opcional: quiero recibir por WhatsApp recordatorios de revisión periódica y la invitación a opinar sobre mi visita.</span></label>`;

  const fieldErr = (name) => `<p class="err" id="err-${name}" hidden></p>`;
  const demoNote = '<p class="demo-note">Demostración: ya pusimos datos inventados. No escribas datos reales de pacientes.</p>';
  const bindAviso = (root) => {
    $$('[data-aviso]', root).forEach((b) => {
      b.onclick = (e) => { e.preventDefault(); UI.modal(`<div class="modal-body legal">${avisoBody()}<button class="btn btn-ghost btn-block mt" data-close>Cerrar</button></div>`); };
    });
  };

  function showErrors(form, errors) {
    $$('.err', form).forEach((e) => { e.hidden = true; });
    $$('[aria-invalid]', form).forEach((e) => e.removeAttribute('aria-invalid'));
    let first = null;
    Object.entries(errors).forEach(([name, msg]) => {
      const el = $(`#err-${name}`, form), input = form.elements[name];
      if (el) { el.textContent = msg; el.hidden = false; }
      if (input) { input.setAttribute('aria-invalid', 'true'); first = first || input; }
    });
    first?.focus();
  }

  function datos() {
    if (!draft.start) { Main.go(draft.serviceId ? `#/horario/${draft.serviceId}` : '#/'); return; }
    const svc = Z.service(draft.serviceId);
    app().innerHTML = header() + `<main class="flow"><div class="wrap flow-in narrow">
      <a class="back" href="#/horario/${svc.id}">${icon('i-back', 'ic-sm')}Cambiar horario</a>
      ${stepper(3)}
      <h1>Tus datos</h1>
      <div class="sum-card"><b>${esc(svc.name)}</b><span>${Z.cap(Z.fmtDate(draft.start))}, ${Z.fmtTime(draft.start)}</span></div>
      ${demoNote}
      <form id="f" novalidate>
        <label class="field"><span>Nombre completo</span><input name="name" autocomplete="off" value="Sofía Ejemplo Ramírez" required aria-describedby="err-name">${fieldErr('name')}</label>
        <label class="field"><span>WhatsApp a 10 dígitos</span><input name="phone" type="tel" inputmode="numeric" autocomplete="off" value="771 000 0099" required aria-describedby="err-phone">${fieldErr('phone')}</label>
        <label class="field"><span>Correo <small>(opcional)</small></span><input name="email" type="email" autocomplete="off" aria-describedby="err-email">${fieldErr('email')}</label>
        <label class="field"><span>Motivo o síntoma <small>(opcional)</small></span><textarea name="reason" rows="2">Me duele una muela al tomar frío</textarea></label>
        <fieldset class="field"><legend>¿Es tu primera vez con nosotros?</legend>
          <div class="seg"><label><input type="radio" name="firstVisit" value="1" checked><span>Sí, primera vez</span></label><label><input type="radio" name="firstVisit" value="0"><span>Ya he venido</span></label></div>
          <p class="err" id="err-firstVisit" hidden></p></fieldset>
        ${consentFields()}
        <p class="err" id="err-privacy" hidden></p>
        <button class="btn btn-volt btn-lg btn-block">Apartar mi cita</button>
      </form>
    </div></main>` + footer();
    const f = $('#f');
    bindAviso(f);
    f.addEventListener('submit', (e) => {
      e.preventDefault();
      const v = Object.fromEntries(new FormData(f));
      const errors = {};
      if ((v.name || '').trim().length < 3) errors.name = 'Escribe tu nombre completo.';
      if (!Z.validPhone(v.phone)) errors.phone = 'Escribe un número de 10 dígitos, sin lada internacional.';
      if (v.email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v.email)) errors.email = 'Revisa tu correo o déjalo en blanco.';
      if (!v.firstVisit) errors.firstVisit = 'Elige una opción.';
      if (!v.privacy) errors.privacy = 'Necesitamos tu autorización para apartar la cita.';
      if (Object.keys(errors).length) { showErrors(f, errors); return; }
      try {
        const a = Z.book({ serviceId: draft.serviceId, start: draft.start, name: v.name.trim(), phone: v.phone, email: (v.email || '').trim(), reason: (v.reason || '').trim(), firstVisit: v.firstVisit === '1', optIn: !!v.optIn, source: 'web' });
        draft.key = draft.start = draft.serviceId = null;
        Main.setPhoneOwner(a.phone); Main.refreshBadge();
        Main.go(`#/listo/${a.token}`);
      } catch (err) {
        if (err.code === 'taken') { toast(err.message, 'err'); draft.start = null; Main.go(`#/horario/${draft.serviceId}`); } else toast(err.message, 'err');
      }
    });
  }

  /* ---------- Confirmación y gestión ---------- */
  const apptSummary = (a) => {
    const s = Z.service(a.serviceId);
    return `<dl class="facts">
      <div><dt>Cuándo</dt><dd>${Z.cap(Z.fmtDate(a.start))}, ${Z.fmtTime(a.start)}</dd></div>
      <div><dt>Servicio</dt><dd>${esc(s.name)}</dd></div>
      <div><dt>Dónde</dt><dd>${esc(C.address)}<br><a href="${C.maps}" target="_blank" rel="noopener">Abrir en Google Maps</a></dd></div>
    </dl>`;
  };

  function listo(token) {
    const a = Z.appt(token);
    if (!a) { Main.go('#/'); return; }

    app().innerHTML = header() + `<main class="flow"><div class="wrap flow-in narrow">
      <div class="done-mark">${icon('i-check')}</div>
      <h1 tabindex="-1" id="doneTitle">Tu cita quedó apartada</h1>
      ${apptSummary(a)}
      <section class="wa-section">
        <h2>Esto le llega a su WhatsApp</h2>

      <section class="prep"><h2>Antes de venir</h2><ul>
