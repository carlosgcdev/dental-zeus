        <li>${esc(s.prep)}</li></ul></section>

      <section class="wa-section">
        <h2>Y estos son los siguientes mensajes</h2>
        <div class="tabs-mini" role="tablist" aria-label="Recordatorios">${Z.PREVIEWS.map((x, i) => `<button type="button" role="tab" aria-selected="${i === 0}" data-prev="${x.id}">${x.when}</button>`).join('')}</div>
        <div id="prevBox"></div>
      </section>

      <div class="stack mt">
        <a class="btn btn-volt btn-lg btn-block" href="#/panel/agenda" data-show="${a.id}">Ver la cita en la agenda del consultorio</a>
        <a class="btn btn-ghost btn-block" href="${Z.gcalLink(a)}" target="_blank" rel="noopener">Agregar a mi calendario</a>
      </div>
    </div></main>` + footer();
    $('#doneTitle').focus();
    const renderThread = () => {
      const box = $('#thread');
      if (!box) return;
      const msgs = Z.S.messages.filter((m) => m.apptId === a.id);
      box.innerHTML = Main.waFrame(msgs.map(Main.bubble).join(''));
      Main.bindActions(box, renderThread);
    };
    renderThread();
    const showPrev = (id) => {
      const x = Z.PREVIEWS.find((v) => v.id === id), p = Z.S.patients[a.phone];
      $('#prevBox').innerHTML = Main.waFrame(`<article class="bubble"><p class="bubble-text">${esc(x.text(a, p, s)).replace(/\n/g, '<br>')}</p></article><div class="bubble-btns is-static">${x.buttons.map((b) => `<span>${esc(b)}</span>`).join('')}</div>`, x.when);
      $$('[data-prev]').forEach((b) => b.setAttribute('aria-selected', b.dataset.prev === id));
    };
    $$('[data-prev]').forEach((b) => { b.onclick = () => showPrev(b.dataset.prev); });
    showPrev('r24');
    $('[data-show]').addEventListener('click', () => Panel.focusAppt(a.id));
  }

  function cita(token) {
    const a = Z.appt(token);
    if (!a) { app().innerHTML = header() + '<main class="flow"><div class="wrap flow-in narrow"><h1>No encontramos esta cita</h1><p class="sub">Escríbenos por WhatsApp y te ayudamos.</p></div></main>'; return; }
    const open = ['pendiente', 'confirmada'].includes(a.status) && a.start > Z.now();
    const late = a.start - Z.now() < Z.S.settings.minLeadHours * Z.HOUR;
    const title = { pendiente: 'Falta que confirmes tu cita', confirmada: 'Tu cita está confirmada', cancelada: 'Esta cita fue cancelada', terminada: 'Esta cita ya terminó', no_asistio: 'No pudimos atenderte en esta cita', llego: 'Ya estás en el consultorio', en_atencion: 'Te estamos atendiendo' }[a.status];
    app().innerHTML = header() + `<main class="flow"><div class="wrap flow-in narrow">
      <p class="chip chip-${a.status}">${Z.STATUS[a.status]}</p>
      <h1>${title}</h1>
      ${apptSummary(a)}
      ${open && !late ? `<div class="stack">
        ${a.status === 'pendiente' ? '<button class="btn btn-volt btn-lg btn-block" id="cConfirm">Confirmar asistencia</button>' : ''}
        <a class="btn btn-ghost btn-block" href="#/reagendar/${a.token}">Cambiar de horario</a>
        <button class="btn btn-ghost-danger btn-block" id="cCancel">Cancelar cita</button></div>` : ''}
      ${open && late ? `<div class="note"><p>Faltan menos de ${Z.S.settings.minLeadHours} horas. Para cambiar tu cita, escríbenos por WhatsApp.</p><a class="btn btn-ghost btn-block" href="https://wa.me/${C.wa}" target="_blank" rel="noopener">${icon('i-wa')}Escribir por WhatsApp</a></div>` : ''}
      ${!open && ['cancelada', 'no_asistio', 'terminada'].includes(a.status) ? '<a class="btn btn-volt btn-lg btn-block" href="#/">Agendar otra cita</a>' : ''}
    </div></main>` + footer() + urgentBar();
    $('#cConfirm')?.addEventListener('click', () => { Z.confirm(a.id); toast('Gracias. Tu cita está confirmada.', 'ok'); Main.refreshBadge(); cita(token); });
    $('#cCancel')?.addEventListener('click', async () => {
      const yes = await confirmDialog({ title: '¿Cancelar tu cita?', body: `${Z.cap(Z.fmtDate(a.start))}, ${Z.fmtTime(a.start)}. Este horario quedará libre para otro paciente.`, yes: 'Sí, cancelar', no: 'Conservar mi cita', danger: true });
      if (yes) { const offered = Z.cancel(a.id); toast('Tu cita quedó cancelada.'); Main.refreshBadge(); cita(token); Main.showOffer(offered); }
    });
  }

  /* ---------- Lista de espera ---------- */
  function espera(serviceId) {
    const svc = Z.service(serviceId);
    if (!svc) { Main.go('#/'); return; }
    app().innerHTML = header() + `<main class="flow"><div class="wrap flow-in narrow">
      <a class="back" href="#/horario/${svc.id}">${icon('i-back', 'ic-sm')}Volver a los horarios</a>
      <h1>Lista de espera</h1>
      <p class="sub">Si alguien cancela, te avisamos en orden de llegada y guardamos el horario ${Z.S.settings.holdMin} minutos para ti.</p>
      <div class="sum-card"><b>${esc(svc.name)}</b><span>${svc.dur} minutos</span></div>
      ${demoNote}
      <form id="w" novalidate>
        <label class="field"><span>Nombre completo</span><input name="name" autocomplete="off" value="Julián Ejemplo Mejía" required>${fieldErr('name')}</label>
        <label class="field"><span>WhatsApp a 10 dígitos</span><input name="phone" type="tel" inputmode="numeric" autocomplete="off" value="771 000 0098" required>${fieldErr('phone')}</label>
        <fieldset class="field"><legend>¿A qué hora te conviene?</legend><div class="seg">
          <label><input type="radio" name="pref" value="cualquiera" checked><span>Cualquiera</span></label>
          <label><input type="radio" name="pref" value="temprano"><span>Antes de 2 p. m.</span></label>
          <label><input type="radio" name="pref" value="tarde"><span>Por la tarde</span></label></div></fieldset>
        <label class="field"><span>Avisarme hasta</span><input name="until" type="date" min="${Z.dayKey(Z.now())}" max="${Z.addDays(Z.dayKey(Z.now()), Z.S.settings.maxDays)}" value="${Z.addDays(Z.dayKey(Z.now()), 14)}" required></label>
        ${consentFields()}
        <p class="err" id="err-privacy" hidden></p>
        <button class="btn btn-volt btn-lg btn-block">Unirme a la lista</button>
      </form></div></main>` + footer();
    const f = $('#w');
    bindAviso(f);
    f.addEventListener('submit', (e) => {
      e.preventDefault();
      const v = Object.fromEntries(new FormData(f)), errors = {};
      if ((v.name || '').trim().length < 3) errors.name = 'Escribe tu nombre completo.';
      if (!Z.validPhone(v.phone)) errors.phone = 'Escribe un número de 10 dígitos.';
      if (!v.privacy) errors.privacy = 'Necesitamos tu autorización para avisarte.';
      if (Object.keys(errors).length) { showErrors(f, errors); return; }
      Z.joinWaitlist({ name: v.name.trim(), phone: v.phone, serviceId, pref: v.pref, until: v.until, optIn: !!v.optIn });
      Main.setPhoneOwner(Z.normPhone(v.phone));
      app().innerHTML = header() + `<main class="flow"><div class="wrap flow-in narrow"><div class="done-mark">${icon('i-check')}</div><h1>Ya estás en la lista</h1><p class="sub">Si se libera un horario para ${esc(svc.name.toLowerCase())}, te escribiremos por WhatsApp.</p><a class="btn btn-ghost btn-block" href="#/">Volver al inicio</a></div></main>`;
    });
  }


  /* ---------- Aviso de privacidad (borrador) ---------- */
  function aviso() {
    app().innerHTML = header() + `<main class="flow"><article class="wrap flow-in narrow legal">${avisoBody()}</article></main>` + footer();
  }
  function avisoBody() {
    return `
      <p class="chip chip-pendiente">Borrador: requiere revisión legal</p>
      <h1>Aviso de privacidad</h1>
      <p><b>Responsable.</b> ${esc(C.name)}, representado por [POR CONFIRMAR: nombre legal del titular], con domicilio en ${esc(C.address)}. Contacto: ${C.email}, ${C.phone}.</p>
      <h2>Datos que tratamos</h2>
      <p>Identificación y contacto: nombre, número de WhatsApp y correo. <b>Datos personales sensibles:</b> el motivo de consulta, los síntomas y la información de salud que compartas. Si agendas para una niña o un niño, también los de su madre, padre o tutor.</p>
      <h2>Para qué los usamos</h2>
      <p><b>Finalidades necesarias:</b> apartar, confirmar, cambiar y recordar tus citas; brindarte atención dental; llevar tu historial de citas; integrar tu expediente clínico conforme a la normativa de salud.</p>
      <p><b>Finalidades opcionales,</b> solo si las aceptas: recordatorios de revisión periódica e invitación a opinar sobre tu visita. No aceptarlas no afecta tu atención.</p>
      <h2>Consentimiento</h2>
      <p>Al marcar la casilla del formulario otorgas tu consentimiento expreso para el tratamiento de tus datos, incluidos los sensibles. Puedes revocarlo en cualquier momento.</p>
      <h2>Con quién se comparten</h2>
      <p>Usamos proveedores que nos ayudan a operar este sistema y enviar mensajes: [POR CONFIRMAR: proveedor de base de datos, proveedor de WhatsApp, proveedor de correo]. Actúan por encargo del consultorio. No vendemos tus datos. Solo los transferimos a terceros cuando la ley lo permite o lo exige, o con tu consentimiento.</p>
      <h2>Tus derechos ARCO</h2>
      <p>Puedes solicitar acceso, rectificación, cancelación u oposición, limitar el uso de tus datos o revocar tu consentimiento escribiendo a ${C.email} con tu nombre, una forma de acreditar tu identidad y lo que solicitas. Responderemos en [POR CONFIRMAR: plazos conforme a la ley vigente]. La autoridad competente es la Secretaría Anticorrupción y Buen Gobierno.</p>
      <h2>Cambios</h2>
      <p>Publicaremos cualquier cambio en esta página. Última actualización: [POR CONFIRMAR].</p>`;
  }

  return { home, horario, datos, listo, cita, espera, aviso, draft };
})();

/* Vista consultorio: agenda, lista de espera, pacientes, métricas, mensajes y ajustes. */
const Panel = (() => {
  'use strict';
  const { esc, icon, $, $$, toast, modal, closeModal, confirmDialog } = UI;
  const Z = Zeus;
  const app = () => $('#app');
  const view = { tab: 'agenda', mode: 'dia', day: null, weekStart: null, focus: null, metricWeeks: 8, patientQuery: '' };

  const TABS = [['agenda', 'Agenda'], ['espera', 'Lista de espera'], ['pacientes', 'Pacientes'], ['metricas', 'Métricas'], ['mensajes', 'Mensajes'], ['ajustes', 'Ajustes']];
  const NEXT = { pendiente: ['confirmada', 'llego', 'no_asistio'], confirmada: ['llego', 'no_asistio'], llego: ['en_atencion'], en_atencion: ['terminada'], terminada: [], no_asistio: [], cancelada: [] };

  function render(tab) {
    if (tab) view.tab = tab;
    if (!view.day) view.day = Z.S.anchor;
    if (!view.weekStart) view.weekStart = Z.S.anchor;
    const flagged = Z.S.appts.filter((a) => a.flag).length;
    app().innerHTML = `<header class="adm-top"><div class="wrap adm-top-in">${UI.logoLockup('#/panel')}
        <button class="btn btn-volt btn-sm" id="newAppt">+ Nueva cita</button></div>
      <div class="wrap"><div class="adm-tabs" role="tablist">${TABS.map(([id, label]) => `<a role="tab" aria-selected="${view.tab === id}" href="#/panel/${id}" class="${view.tab === id ? 'on' : ''}">${label}${id === 'agenda' && flagged ? `<span class="dot-count">${flagged}</span>` : ''}</a>`).join('')}</div></div></header>
      <main class="adm"><div class="wrap" id="admBody"></div></main>`;
    ({ agenda, espera, pacientes, metricas, mensajes, ajustes }[view.tab] || agenda)();
    $('#newAppt').onclick = () => manualForm();
    const tabs = $('.adm-tabs'), on = $('.adm-tabs .on');
    if (on) tabs.scrollLeft = on.offsetLeft - (tabs.clientWidth - on.offsetWidth) / 2 - tabs.offsetLeft;
  }
  const refresh = () => { Main.refreshBadge(); render(); };

  function focusAppt(id) {
    const a = Z.appt(id);
    if (!a) return;
    view.tab = 'agenda'; view.mode = 'dia'; view.day = Z.dayKey(a.start); view.focus = id;
  }

  /* ---------- Agenda ---------- */
  const countOf = (n, word) => `${n} ${word}${n === 1 ? "" : "s"}`;
  const chip = (s) => `<span class="chip chip-${s}">${Z.STATUS[s]}</span>`;

  const apptRow = (a) => {
    const p = Z.S.patients[a.phone], s = Z.service(a.serviceId);
    return `<button type="button" class="ag-card st-${a.status} ${view.focus === a.id ? 'is-focus' : ''}" data-appt="${a.id}" ${view.focus === a.id ? 'id="focusCard"' : ''}>
      <span class="ag-main"><b>${esc(p.name)}</b><span>${esc(s.name)} · ${s.dur} min${a.firstVisit ? ' · Primera vez' : ''}</span></span>
      <span class="ag-side">${chip(a.status)}${a.flag ? '<span class="flag">Sin confirmar</span>' : ''}${a.isNew ? '<span class="new-tag">Nueva</span>' : ''}</span>
    </button>`;
  };

  function dayList(key) {
    const w = Z.windowOf(key);
    const items = Z.S.appts.filter((a) => Z.dayKey(a.start) === key && a.status !== 'cancelada').sort((a, b) => a.start - b.start);
    const blocks = Z.S.blocks.filter((b) => b.from < Z.fromLocal(key, 1440) && b.to > Z.fromLocal(key, 0));
    if (!w) return '<p class="empty">Cerrado este día.</p>';
    let html = '', cursor = w.open;
    const gap = (from, to) => (to - from >= 20 ? `<li class="ag-free"><span class="ag-time">${Z.fmtMinutes(from)}</span><span class="ag-free-line">Libre hasta las ${Z.fmtMinutes(to)}</span></li>` : '');
    blocks.forEach((b) => { html += `<li class="ag-block"><span class="ag-time">${Z.fmtTime(Math.max(b.from, Z.fromLocal(key, w.open)))}</span><span class="ag-block-line">${esc(b.label || 'Horario bloqueado')}</span></li>`; });
    items.forEach((a) => {
      const m = Z.minutesOf(a.start);
      html += gap(cursor, m);
      html += `<li class="ag-item"><span class="ag-time">${Z.fmtTime(a.start)}</span>${apptRow(a)}</li>`;
      cursor = Math.max(cursor, Z.minutesOf(a.end) + Z.S.settings.bufferMin);
    });
    html += gap(cursor, w.close);
    return `<ol class="ag-list">${html}</ol>`;
  }

  function agenda() {
    const flagged = Z.S.appts.filter((a) => a.flag).sort((a, b) => a.start - b.start);
    const dayNav = view.mode === 'dia'
      ? `<button class="icon-btn" data-go="-1" aria-label="Día anterior">${icon('i-back')}</button><b>${Z.cap(Z.fmtKey(view.day))}</b><button class="icon-btn" data-go="1" aria-label="Día siguiente">${icon('i-next')}</button>`
      : `<button class="icon-btn" data-go="-7" aria-label="Semana anterior">${icon('i-back')}</button><b>Del ${Z.fmtKey(view.weekStart).replace(/^\S+ /, '')} al ${Z.fmtKey(Z.addDays(view.weekStart, 6)).replace(/^\S+ /, '')}</b><button class="icon-btn" data-go="7" aria-label="Semana siguiente">${icon('i-next')}</button>`;
    $('#admBody').innerHTML = `
      ${flagged.length ? `<section class="alert" aria-label="Citas por atender"><h2>${flagged.length === 1 ? 'Una cita sigue' : `${flagged.length} citas siguen`} sin confirmar</h2>
        ${flagged.map((a) => `<div class="alert-row"><div><b>${esc(Z.S.patients[a.phone].name)}</b><span>${Z.cap(Z.fmtDate(a.start))}, ${Z.fmtTime(a.start)}</span></div>
          <div class="alert-actions"><a class="btn btn-ghost btn-sm" href="tel:+52${a.phone}" data-demo-call>Llamar</a><button class="btn btn-ghost-danger btn-sm" data-free="${a.id}">Liberar</button></div></div>`).join('')}</section>` : ''}
      <div class="ag-bar"><div class="seg-sm"><button class="${view.mode === 'dia' ? 'on' : ''}" data-mode="dia">Día</button><button class="${view.mode === 'semana' ? 'on' : ''}" data-mode="semana">Semana</button></div></div>
      <div class="ag-nav">${dayNav}</div>
      ${view.mode === 'dia' ? dayList(view.day) : weekGrid()}`;
    const body = $('#admBody');
    $$('[data-mode]', body).forEach((b) => { b.onclick = () => { view.mode = b.dataset.mode; render(); }; });
    $$('[data-go]', body).forEach((b) => {
      b.onclick = () => {
        const n = Number(b.dataset.go);
        if (view.mode === 'dia') view.day = Z.addDays(view.day, n); else view.weekStart = Z.addDays(view.weekStart, n);
        view.focus = null; render();
      };
    });
    $$('[data-appt]', body).forEach((b) => { b.onclick = () => detail(b.dataset.appt); });
    $$('[data-week-day]', body).forEach((b) => { b.onclick = () => { view.mode = 'dia'; view.day = b.dataset.weekDay; render(); }; });
    $$('[data-free]', body).forEach((b) => { b.onclick = () => release(b.dataset.free); });
    $$('[data-demo-call]', body).forEach((b) => { b.onclick = (e) => { e.preventDefault(); toast('En la versión real, este botón marca al paciente.'); }; });
    if (view.focus) {
      const card = $('#focusCard');
      if (card) { card.scrollIntoView({ block: 'center' }); toast('La cita ya está en la agenda.', 'ok'); }
      view.focus = null;
    }
  }

  function weekGrid() {
    let html = '';
    for (let i = 0; i < 7; i++) {
      const key = Z.addDays(view.weekStart, i);
      if (!Z.windowOf(key)) continue;
      const items = Z.S.appts.filter((a) => Z.dayKey(a.start) === key && a.status !== 'cancelada').sort((a, b) => a.start - b.start);
      html += `<section class="wk-day"><button class="wk-head" data-week-day="${key}"><b>${Z.cap(Z.fmtKey(key).replace(/ de \S+$/, ''))}</b><span>${items.length} ${items.length === 1 ? 'cita' : 'citas'}</span></button>
        ${items.length ? `<ul>${items.map((a) => `<li><button class="wk-row st-${a.status}" data-appt="${a.id}"><span class="wk-time">${Z.fmtTime(a.start)}</span><span class="wk-name">${esc(Z.firstName(Z.S.patients[a.phone].name))} · ${esc(Z.service(a.serviceId).name)}</span><span class="wk-state">${Z.STATUS[a.status]}</span></button></li>`).join('')}</ul>` : '<p class="empty-sm">Sin citas</p>'}</section>`;
    }
    return `<div class="wk-grid">${html}</div>`;
  }

  async function release(id) {
    const a = Z.appt(id), p = Z.S.patients[a.phone];
    const yes = await confirmDialog({ title: '¿Liberar este horario?', body: `Se cancela la cita de ${p.name} (${Z.fmtDate(a.start)}, ${Z.fmtTime(a.start)}) y se avisa a la lista de espera.`, yes: 'Liberar horario', danger: true });
    if (!yes) return;
    const offered = Z.cancel(id, 'consultorio');
    refresh();
    if (offered) Main.showOffer(offered); else toast('Horario liberado. Nadie en la lista de espera puede tomarlo.');
  }

  function detail(id) {
    const a = Z.appt(id), p = Z.S.patients[a.phone], s = Z.service(a.serviceId);
    const history = Z.S.appts.filter((x) => x.phone === a.phone && x.start < Z.now() && x.id !== a.id);
    const attended = history.filter((x) => x.status === 'terminada').length, missed = history.filter((x) => x.status === 'no_asistio').length;
    const canManage = ['pendiente', 'confirmada'].includes(a.status);
    const m = modal(`<div class="modal-body">
      <div class="modal-head"><h2>${esc(p.name)}</h2><button class="icon-btn" data-close aria-label="Cerrar">✕</button></div>
      <p class="modal-sub">${Z.cap(Z.fmtDate(a.start))}, ${Z.fmtTime(a.start)} · ${esc(s.name)}</p>
      <p>${chip(a.status)}</p>
      <dl class="facts compact">
        <div><dt>WhatsApp</dt><dd>${Z.prettyPhone(a.phone)}</dd></div>
        <div><dt>Motivo</dt><dd>${esc(a.reason) || 'Sin especificar'}</dd></div>
        <div><dt>Origen</dt><dd>${esc(Z.cap(a.source))}${a.firstVisit ? ' · Primera vez' : ''}</dd></div>
        <div><dt>Historial</dt><dd>${countOf(attended, "asistencia")}, ${countOf(missed, "falta")}</dd></div>
        ${p.notes ? `<div><dt>Notas</dt><dd>${esc(p.notes)}</dd></div>` : ''}
      </dl>
      ${NEXT[a.status].length ? `<h3 class="mini-h">Cambiar estado</h3><div class="state-btns">${NEXT[a.status].map((st) => `<button class="btn btn-ghost btn-sm" data-state="${st}">${Z.STATUS[st]}</button>`).join('')}</div>` : ''}
      ${canManage ? `<div class="row-end mt"><button class="btn btn-ghost btn-sm" data-move>Reagendar</button><button class="btn btn-ghost-danger btn-sm" data-cancel>Cancelar cita</button></div>` : ''}
    </div>`);
    $$('[data-state]', m).forEach((b) => {
      b.onclick = () => {
        if (b.dataset.state === 'confirmada') Z.confirm(a.id); else Z.setStatus(a.id, b.dataset.state);
        a.isNew = false;
        closeModal(); refresh(); toast(`Estado actualizado: ${Z.STATUS[b.dataset.state]}.`, 'ok');
      };
    });
    $('[data-move]', m)?.addEventListener('click', () => moveForm(a));
    $('[data-cancel]', m)?.addEventListener('click', () => { closeModal(); release(a.id); });
  }

  /* ---------- Selector de horario compartido ---------- */
  function slotPicker(root, serviceId, opts, onPick) {
    const dateInput = $('[name=date]', root), box = $('#slotPick', root);
    let picked = null;
    const draw = () => {
      const list = Z.slots(serviceId(), dateInput.value, { staff: true, ...opts });
      picked = null; onPick(null);
      box.innerHTML = list.length
        ? `<div class="slot-grid">${list.map((s) => `<button type="button" class="slot" data-s="${s}" aria-pressed="false">${Z.fmtTime(s)}</button>`).join('')}</div>`
        : '<p class="muted">No hay horarios libres ese día para este servicio. No se permite sobrecupo.</p>';
      $$('[data-s]', box).forEach((b) => {
        b.onclick = () => {
          $$('[data-s]', box).forEach((x) => { x.classList.remove('sel'); x.setAttribute('aria-pressed', 'false'); });
          b.classList.add('sel'); b.setAttribute('aria-pressed', 'true');
          picked = Number(b.dataset.s); onPick(picked);
        };
      });
    };
    dateInput.addEventListener('change', draw);
    draw();
    return draw;
  }

  function moveForm(a) {
    const key = Z.firstAvailableDay(a.serviceId, { staff: true, ignoreAppt: a.id }) || Z.dayKey(Z.now());
    const m = modal(`<div class="modal-body"><div class="modal-head"><h2>Reagendar</h2><button class="icon-btn" data-close aria-label="Cerrar">✕</button></div>
      <p class="modal-sub">${esc(Z.S.patients[a.phone].name)} · ${esc(Z.service(a.serviceId).name)}</p>
      <label class="field"><span>Nuevo día</span><input type="date" name="date" value="${key}" min="${Z.dayKey(Z.now())}"></label>
      <div id="slotPick"></div><button class="btn btn-volt btn-block mt" id="moveGo" disabled>Mover cita</button></div>`);
    let start = null;
    slotPicker(m, () => a.serviceId, { ignoreAppt: a.id }, (v) => { start = v; $('#moveGo').disabled = !v; });
    $('#moveGo').onclick = () => {
      try {
        const { offered } = Z.reschedule(a.id, start, true);
        view.day = Z.dayKey(start); view.mode = 'dia';
        closeModal(); refresh(); toast('Cita movida. Se avisó al paciente.', 'ok');
        Main.showOffer(offered);
      } catch (e) { toast(e.message, 'err'); }
    };
  }

  function manualForm() {
    const svcs = Z.S.services.filter((s) => s.active);
    const first = svcs[0].id, key = Z.firstAvailableDay(first, { staff: true }) || Z.dayKey(Z.now());
    const m = modal(`<div class="modal-body"><div class="modal-head"><h2>Nueva cita</h2><button class="icon-btn" data-close aria-label="Cerrar">✕</button></div>
      <p class="modal-sub">Para pacientes que llaman o llegan en persona.</p>
      <form id="mForm" novalidate>
      <label class="field"><span>Nombre</span><input name="name" value="Tomás Ejemplo Rivas" autocomplete="off"></label>
      <label class="field"><span>WhatsApp a 10 dígitos</span><input name="phone" inputmode="numeric" value="771 000 0097" autocomplete="off"></label>
      <label class="field"><span>Origen</span><select name="source"><option value="teléfono">Teléfono</option><option value="en persona">En persona</option></select></label>
      <label class="field"><span>Servicio</span><select name="svc">${svcs.map((s) => `<option value="${s.id}">${esc(s.name)} (${s.dur} min)</option>`).join('')}</select></label>
      <label class="field"><span>Día</span><input type="date" name="date" value="${key}" min="${Z.dayKey(Z.now())}"></label>
      <div id="slotPick"></div>
      <button class="btn btn-volt btn-block mt" id="mGo" disabled>Agendar</button></form></div>`);
    let start = null;
    const redraw = slotPicker(m, () => $('[name=svc]', m).value, {}, (v) => { start = v; $('#mGo').disabled = !v; });
    $('[name=svc]', m).addEventListener('change', redraw);
    $('#mForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const f = e.target;
      if (f.elements.name.value.trim().length < 3) { toast('Escribe el nombre del paciente.', 'err'); return; }
      try {
        const a = Z.book({ serviceId: f.elements.svc.value, start, name: f.elements.name.value.trim(), phone: f.elements.phone.value, source: f.elements.source.value });
        focusAppt(a.id); closeModal(); render(); Main.refreshBadge();
      } catch (err) { toast(err.message, 'err'); }
    });
  }

  /* ---------- Lista de espera ---------- */
  const PREF = { cualquiera: 'Cualquier hora', temprano: 'Antes de 2 p. m.', tarde: 'Por la tarde' };
  const WSTATE = { esperando: 'Esperando', avisado: 'Avisado', agendado: 'Ya agendó' };
  function espera() {

    $('#admBody').innerHTML = `<h1 class="adm-h">Lista de espera</h1>
      <p class="sub">Cuando se libera un horario, el sistema avisa al primero al que le queda. Si no puede, pasa al siguiente.</p>
      ${list.length ? `<ol class="wait-list">${list.map((w, i) => `<li><span class="wait-n">${i + 1}</span><div class="wait-info"><b>${esc(w.name)}</b><span>${esc(Z.service(w.serviceId).name)} · ${PREF[w.pref]}</span><span>Hasta el ${Z.fmtKey(w.until)}</span>
        ${w.offer ? `<span class="offer">Ofrecido: ${Z.fmtDate(w.offer.start)}, ${Z.fmtTime(w.offer.start)}</span>` : ''}</div>
        <div class="wait-side"><span class="chip chip-${w.status === 'avisado' ? 'pendiente' : w.status === 'agendado' ? 'confirmada' : 'terminada'}">${WSTATE[w.status]}</span>
        <button class="btn btn-ghost btn-sm" data-rm="${w.id}">Quitar</button></div></li>`).join('')}</ol>` : '<p class="empty">Nadie en lista de espera.</p>'}`;
    $$('[data-rm]').forEach((b) => { b.onclick = () => { Z.removeWait(b.dataset.rm); refresh(); }; });

  /* ---------- Pacientes ---------- */
  function patientStats(phone) {
    const list = Z.S.appts.filter((a) => a.phone === phone).sort((a, b) => b.start - a.start);
    const past = list.filter((a) => a.start < Z.now());
    return { list, attended: past.filter((a) => a.status === 'terminada').length, missed: past.filter((a) => a.status === 'no_asistio').length, last: past[0] };
  }
  function pacientes() {
    const q = view.patientQuery.toLowerCase();
    const rows = Object.values(Z.S.patients).filter((p) => p.name.toLowerCase().includes(q) || p.phone.includes(q)).sort((a, b) => a.name.localeCompare(b.name, 'es'));
    $('#admBody').innerHTML = `<h1 class="adm-h">Pacientes</h1>
      <label class="field"><span>Buscar por nombre o teléfono</span><input id="pq" type="search" value="${esc(view.patientQuery)}" autocomplete="off"></label>
      <ul class="pat-list" id="patList">${rows.map((p) => { const st = patientStats(p.phone); return `<li><button data-p="${p.phone}"><span><b>${esc(p.name)}</b><small>${Z.prettyPhone(p.phone)}</small></span><span class="pat-stats">${countOf(st.attended, "asistencia")} · ${countOf(st.missed, "falta")}</span></button></li>`; }).join('') || '<li class="empty">Sin resultados.</li>'}</ul>`;
    const pq = $('#pq');
    pq.oninput = () => { view.patientQuery = pq.value; pacientes(); const again = $('#pq'); again.focus(); again.setSelectionRange(again.value.length, again.value.length); };
    $$('[data-p]').forEach((b) => { b.onclick = () => patientDetail(b.dataset.p); });
  }
  function patientDetail(phone) {
    const p = Z.S.patients[phone], st = patientStats(phone);
    const m = modal(`<div class="modal-body"><div class="modal-head"><h2>${esc(p.name)}</h2><button class="icon-btn" data-close aria-label="Cerrar">✕</button></div>
      <p class="modal-sub">${Z.prettyPhone(phone)} · ${countOf(st.attended, "asistencia")} · ${countOf(st.missed, "falta")}</p>
      <label class="field"><span>Notas del consultorio</span><textarea id="pNotes" rows="2">${esc(p.notes)}</textarea></label>
      <h3 class="mini-h">Citas</h3>
      ${st.list.length ? `<ul class="hist">${st.list.slice(0, 12).map((a) => `<li><span><b>${esc(Z.service(a.serviceId).name)}</b><small>${Z.cap(Z.fmtDate(a.start))}, ${Z.fmtTime(a.start)}</small></span>${chip(a.status)}</li>`).join('')}</ul>` : '<p class="muted">Sin citas registradas.</p>'}
    </div>`);
    $('#pNotes', m).addEventListener('input', (e) => { p.notes = e.target.value; });
  }

  /* ---------- Métricas ---------- */
  const pct = (n) => `${Math.round(n * 100)} %`;
  function metricas() {
    const M = Z.metrics(view.metricWeeks), maxW = Math.max(...M.perWeek.map((w) => w.count), 1), maxS = Math.max(...M.top.map((t) => t.count), 1), maxH = Math.max(...Object.values(M.heat), 1);
    const short = (key) => { const [, m, d] = key.split('-').map(Number); return `${d} ${Z.MONTHS[m - 1].slice(0, 3)}`; };
    const hours = []; for (let h = 11; h <= 19; h++) hours.push(h);
    const days = [1, 2, 3, 4, 5, 6];
    const shade = (v) => { if (!v) return 'var(--heat-0)'; const steps = ['#CFE0FF', '#9DBEFF', '#5F92FF', '#2A6BF2', '#0B4BC8']; return steps[Math.min(4, Math.floor((v / maxH) * 4.999))]; };
    const hLabel = (h) => (h % 12 || 12) + (h < 12 ? 'a' : 'p');
    $('#admBody').innerHTML = `<div class="adm-h-row"><h1 class="adm-h">Métricas</h1>
        <div class="seg-sm">${[4, 8].map((n) => `<button data-w="${n}" class="${view.metricWeeks === n ? 'on' : ''}">${n} semanas</button>`).join('')}</div></div>
      <p class="demo-note">Datos de ejemplo. Se recalculan con lo que hagas en la demo.</p>
      <div class="tiles">
        <div class="tile"><span>Citas</span><b>${M.total}</b><small>en ${view.metricWeeks} semanas</small></div>
        <div class="tile"><span>Confirmación</span><b>${pct(M.confirmRate)}</b><small>confirmaron su cita</small></div>
        <div class="tile"><span>Inasistencia</span><b>${pct(M.noShowRate)}</b><small>${M.noShow} de ${M.finished + M.noShow} citas</small></div>
        <div class="tile"><span>Más solicitado</span><b class="tile-text">${esc(M.top[0]?.name || '—')}</b><small>${M.top[0]?.count || 0} citas</small></div>
      </div>
      <section class="chart"><h2>Citas por semana</h2>
        <div class="bars" role="img" aria-label="Citas por semana: ${M.perWeek.map((w) => `${short(w.start)}, ${w.count}`).join('; ')}">${M.perWeek.map((w) => `<div class="bar-col" title="Semana del ${short(w.start)}: ${w.count} citas"><span class="bar-val">${w.count}</span><span class="bar ${w.current ? 'bar-now' : ''}" style="height:${(w.count / maxW) * 100}%"></span><span class="bar-lab">${short(w.start)}</span></div>`).join('')}</div>
      </section>
      <section class="chart"><h2>Servicios más solicitados</h2>
        <ul class="hbars">${M.top.slice(0, 6).map((t) => `<li><span class="hb-name">${esc(t.name)}</span><span class="hb-track"><span class="hb-fill" style="width:${(t.count / maxS) * 100}%"></span></span><span class="hb-val">${t.count}</span></li>`).join('')}</ul>
      </section>
      <section class="chart"><h2>Horas con más demanda</h2>
        <div class="heat" role="img" aria-label="Mapa de calor de citas por día y hora">
          <span></span>${hours.map((h) => `<span class="heat-h">${hLabel(h)}</span>`).join('')}
          ${days.map((d) => `<span class="heat-d">${Z.DAYS[d].slice(0, 3)}</span>${hours.map((h) => { const v = M.heat[`${d}-${h}`] || 0; return `<span class="heat-c" style="background:${shade(v)}" title="${Z.DAYS[d]}, ${hLabel(h)}: ${v} citas"></span>`; }).join('')}`).join('')}
        </div>
        <p class="heat-legend"><span>Menos</span><i style="background:var(--heat-0)"></i><i style="background:#CFE0FF"></i><i style="background:#5F92FF"></i><i style="background:#0B4BC8"></i><span>Más citas</span></p>
      </section>`;
    $$('[data-w]').forEach((b) => { b.onclick = () => { view.metricWeeks = Number(b.dataset.w); render(); }; });
  }

      </div></section>
      <section class="card"><h2>Duración de los servicios</h2>
        <ul class="svc-edit">${Z.S.services.map((s) => `<li><label class="he-day"><input type="checkbox" data-sact="${s.id}" ${s.active ? 'checked' : ''}><span>${esc(s.name)}</span></label><label class="he-t"><span class="sr">Minutos de ${esc(s.name)}</span><input type="number" min="10" max="240" step="5" data-sdur="${s.id}" value="${s.dur}"></label><span class="muted">min</span></li>`).join('')}</ul>
      </section>
      <section class="card"><h2>Vacaciones y bloqueos</h2>
        <form id="bForm" class="block-form" novalidate>
          <label class="field"><span>Tipo</span><select name="type">${Object.entries(BLOCK).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}</select></label>
          <label class="field"><span>Desde</span><input type="date" name="from" value="${today}" min="${today}"></label>
          <label class="field"><span>Hasta</span><input type="date" name="to" value="${today}" min="${today}"></label>
          <label class="field"><span>Nota <small>(opcional)</small></span><input name="label" autocomplete="off"></label>
          <button class="btn btn-ghost">Agregar bloqueo</button>
        </form>
        ${Z.S.blocks.length ? `<ul class="blocks">${Z.S.blocks.map((b) => `<li><span><b>${BLOCK[b.type]}</b> ${esc(b.label)}<small>${Z.fmtDate(b.from)} a ${Z.fmtDate(b.to - 1)}</small></span><button class="btn btn-ghost btn-sm" data-unblock="${b.id}">Quitar</button></li>`).join('')}</ul>` : ''}
      </section>
      <section class="card"><h2>Reiniciar demostración</h2><p class="sub">Vuelve la agenda y las métricas a su estado inicial.</p><button class="btn btn-ghost" id="resetDemo">Reiniciar</button></section>`;
    const body = $('#admBody');
    $$('[data-open]', body).forEach((c) => {
      c.onchange = () => {
        const d = c.dataset.open;
        st.hours[d] = c.checked ? { open: 660, close: 1200, breakFrom: null, breakTo: null } : null;
        ajustes(); toast('Horario actualizado.', 'ok');
      };
    });
    $$('[data-h]', body).forEach((i) => {
      i.onchange = () => {
        const h = st.hours[i.dataset.h], v = Z.fromHHMM(i.value), k = i.dataset.k;
        if (v == null || (k === 'open' ? v >= h.close : v <= h.open)) { toast('La hora de apertura debe ser antes del cierre.', 'err'); ajustes(); return; }
        h[k] = v; toast('Horario actualizado.', 'ok');
      };
    });
    $$('[data-rule]', body).forEach((i) => {
      i.onchange = () => {
        const v = Number(i.value);
        if (!Number.isFinite(v) || v < Number(i.min) || v > Number(i.max)) { toast(`Usa un valor entre ${i.min} y ${i.max}.`, 'err'); i.value = st[i.dataset.rule]; return; }
        st[i.dataset.rule] = v; Z.flagUnconfirmed(); toast('Regla actualizada.', 'ok');
      };
    });
    $$('[data-sdur]', body).forEach((i) => {
      i.onchange = () => {
        const v = Number(i.value), s = Z.service(i.dataset.sdur);
        if (!(v >= 10 && v <= 240)) { toast('Usa entre 10 y 240 minutos.', 'err'); i.value = s.dur; return; }
        s.dur = v; toast('Duración actualizada para citas nuevas.', 'ok');
      };
    });
    $$('[data-sact]', body).forEach((c) => { c.onchange = () => { Z.service(c.dataset.sact).active = c.checked; toast(c.checked ? 'Servicio visible para pacientes.' : 'Servicio oculto para pacientes.', 'ok'); }; });
    $('#bForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const f = e.target.elements;
      if (!f.from.value || !f.to.value || f.to.value < f.from.value) { toast('Revisa las fechas del bloqueo.', 'err'); return; }
      const conflicts = Z.addBlock({ type: f.type.value, label: f.label.value.trim(), from: Z.fromLocal(f.from.value, 0), to: Z.fromLocal(Z.addDays(f.to.value, 1), 0) });
      ajustes();
      if (conflicts.length) modal(`<div class="modal-body"><h2>Hay ${conflicts.length} ${conflicts.length === 1 ? 'cita' : 'citas'} en esas fechas</h2><p>El bloqueo solo evita nuevas reservas. Estas citas siguen en pie y hay que moverlas:</p><ul class="hist">${conflicts.map((a) => `<li><span><b>${esc(Z.S.patients[a.phone].name)}</b><small>${Z.cap(Z.fmtDate(a.start))}, ${Z.fmtTime(a.start)}</small></span></li>`).join('')}</ul><button class="btn btn-ghost btn-block mt" data-close>Entendido</button></div>`);
      else toast('Bloqueo agregado.', 'ok');
    });
    $$('[data-unblock]', body).forEach((b) => { b.onclick = () => { Z.removeBlock(b.dataset.unblock); ajustes(); }; });
    $('#resetDemo').onclick = async () => {
      if (await confirmDialog({ title: '¿Reiniciar la demostración?', body: 'Se pierden las citas que agregaste durante la demo.', yes: 'Reiniciar', danger: true })) {
        Z.seed(); view.day = null; view.weekStart = null; view.tab = 'agenda'; view.mode = 'dia';
        Main.go('#/panel/agenda'); render(); Main.refreshBadge(); toast('Demostración reiniciada.', 'ok');
      }
    };
  }

  return { render, focusAppt, softRefresh: () => render() };
})();

/* Enrutador, cambio de vista y vista previa de WhatsApp. */
const Main = (() => {
  'use strict';
  const { esc, icon, $, $$, toast, modal, closeModal, confirmDialog } = UI;
  const Z = Zeus, C = Z.CLINIC;
  let phoneOwner = null;
  let current = location.hash || '#/';

  // Navegación propia: funciona igual en file://, en vistas previas y en hosting.
  function go(h) {
    current = h;
    try { history.pushState(null, '', h); } catch (e) { /* entorno sin historial */ }
    route();
  }

  function route() {
    Z.flagUnconfirmed(); refreshBadge();
    const hash = current.replace(/^#/, '') || '/';
    if (hash === 'servicios' || hash === 'ubicacion') {
      if (!$('#servicios')) Paciente.home();
      document.getElementById(hash)?.scrollIntoView();
      navState('paciente'); return;
    }
    const [, page, id] = hash.split('/');
    const isPanel = page === 'panel';
    navState(isPanel ? 'panel' : 'paciente');
    if (isPanel) { Panel.render(id); return; }
    window.scrollTo(0, 0);
    switch (page) {
      case 'horario': Paciente.horario(id); break;
      case 'datos': Paciente.datos(); break;
      case 'listo': Paciente.listo(id); break;
      case 'cita': Paciente.cita(id); break;
      case 'reagendar': { const a = Z.appt(id); if (a) Paciente.horario(a.serviceId, a.id); else Main.go('#/'); break; }
      case 'espera': Paciente.espera(id); break;
      case 'aviso': Paciente.aviso(); break;
      default: Paciente.home();
    }
  }

  function navState(which) {
    $$('[data-nav]').forEach((a) => {
      const on = a.dataset.nav === which;
      a.classList.toggle('on', on);
      if (on) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    });
  }

  function refreshBadge() {
    const b = $('#phoneCount'), n = Z.S.messages.length;
    b.hidden = !n; b.textContent = n;
  }

  /* ---------- Burbujas de WhatsApp ---------- */
  const bubble = (m) => `<article class="bubble"><p class="bubble-text">${esc(m.text).replace(/\n/g, '<br>')}</p>
    <time>${Z.fmtTime(m.at)}</time></article>
    ${m.buttons.length ? `<div class="bubble-btns">${m.buttons.map((b) => `<button type="button" data-act="${b.action}" data-ref="${b.ref || ''}">${esc(b.label)}</button>`).join('')}</div>` : ''}`;

  const waFrame = (body, sub = 'Cuenta de empresa') => `<div class="wa"><div class="wa-head">${icon('logo', 'wa-logo')}<div><b>${esc(C.name)}</b><small>${esc(sub)}</small></div></div><div class="wa-body">${body}</div></div>`;

  function bindActions(root, after) {
    $$('[data-act]', root).forEach((b) => { b.onclick = () => act(b.dataset.act, b.dataset.ref, after); });
  }

  function threads() {
    const by = {};
    Z.S.messages.forEach((m) => { (by[m.phone] = by[m.phone] || []).push(m); });
    return Object.entries(by).sort((a, b) => b[1][b[1].length - 1].at - a[1][a[1].length - 1].at);
  }

  function renderPhone() {
    const el = $('#phone'), list = threads();
    if (!phoneOwner || !list.some(([p]) => p === phoneOwner)) phoneOwner = list[0]?.[0] || null;
    const msgs = list.find(([p]) => p === phoneOwner)?.[1] || [];
    el.innerHTML = `<div class="ph-top"><b>Celular del paciente</b><button class="icon-btn" data-ph-close aria-label="Cerrar">✕</button></div>
      ${list.length > 1 ? `<label class="ph-sel"><span>Paciente</span><select id="phOwner">${list.map(([p]) => `<option value="${p}" ${p === phoneOwner ? 'selected' : ''}>${esc(Z.S.patients[p]?.name || p)}</option>`).join('')}</select></label>` : ''}
      ${waFrame(msgs.length ? msgs.map(bubble).join('') : '<p class="wa-empty">Todavía no hay mensajes. Aparta una cita en la vista paciente para ver el primero.</p>')}`;
    const body = $('.wa-body', el);
    body.scrollTop = body.scrollHeight;
    $('[data-ph-close]', el).onclick = () => el.close();
    $('#phOwner', el)?.addEventListener('change', (e) => { phoneOwner = e.target.value; renderPhone(); });
    bindActions(el, () => renderPhone());
  }

  // Cuando se libera un horario, enseña el mensaje que recibiría el siguiente de la lista.
  function showOffer(w) {
    if (!w) return;
    const msg = [...Z.S.messages].reverse().find((m) => m.phone === w.phone && m.kind === 'oferta');
    const m = modal(`<div class="modal-body"><h2>Se avisó a ${esc(w.name)}</h2>
      <p>Es quien sigue en la lista de espera y le queda este horario. Así le llega el aviso:</p>
      ${waFrame(bubble(msg))}<button class="btn btn-ghost btn-block mt" data-close>Cerrar</button></div>`);
    bindActions(m, () => { if (m.open) m.close(); });
  }

  async function act(action, ref, after) {
    const a = ref ? Z.appt(ref) : null;
    const stillOpen = a && ['pendiente', 'confirmada'].includes(a.status) && a.start > Z.now();
    const closeAll = () => { const p = $('#phone'); if (p.open) p.close(); closeModal(); };
    switch (action) {
      case 'confirm':
        if (!stillOpen || a.status === 'confirmada') { toast(stillOpen ? 'Esta cita ya está confirmada.' : 'Esta cita ya no se puede confirmar.'); return; }
        Z.confirm(ref); toast('Confirmada. Ya se ve así en la agenda del consultorio.', 'ok'); break;
      case 'reschedule':
        if (!stillOpen) { toast('Esta cita ya no se puede cambiar.'); return; }
        closeAll(); Main.go(`#/reagendar/${a.token}`); return;
      case 'cancel': {
        if (!stillOpen) { toast('Esta cita ya no se puede cancelar.'); return; }
        closeAll();
        const yes = await confirmDialog({ title: '¿Cancelar tu cita?', body: `${Z.cap(Z.fmtDate(a.start))}, ${Z.fmtTime(a.start)}. Este horario quedará libre para otro paciente.`, yes: 'Sí, cancelar', no: 'Conservar mi cita', danger: true });
        if (!yes) return;
        const offered = Z.cancel(ref);
        toast('Cita cancelada. El horario quedó libre.');
        route(); refreshBadge(); showOffer(offered);
        return;
      }
      case 'maps': window.open(C.maps, '_blank', 'noopener'); return;
      case 'book': closeAll(); Main.go('#/'); return;
      case 'offer-accept':
        Z.acceptOffer(ref); toast('Cita apartada desde la lista de espera.', 'ok'); closeAll(); break;
      case 'offer-decline': {
        const next = Z.declineOffer(ref);
        toast(next ? 'Se avisó al siguiente de la lista.' : 'No hay más interesados; el horario queda libre.');
        closeAll(); route(); refreshBadge(); showOffer(next);
        return;
      }
      default: return;
    }
    refreshBadge();
    route();
    if (after) after();
  }

  function init() {
    Z.seed();
    $('#openPhone').onclick = () => { renderPhone(); $('#phone').showModal(); };
    $('#phone').addEventListener('click', (e) => { if (e.target.id === 'phone') e.target.close(); });
    $('#modal').addEventListener('click', (e) => { if (e.target.id === 'modal') e.target.close(); });
    document.addEventListener('click', (e) => {
      const a = e.target.closest('a[href^="#"]');
      if (!a || e.defaultPrevented) return;
      e.preventDefault();
      go(a.getAttribute('href'));
    });
    window.addEventListener('popstate', () => { current = location.hash || '#/'; route(); });
    route();
  }

  return { init, go, refreshBadge, route, bubble, waFrame, bindActions, showOffer, setPhoneOwner: (p) => { phoneOwner = p; } };
})();
document.addEventListener('DOMContentLoaded', Main.init);

</script>
</body>
</html>
